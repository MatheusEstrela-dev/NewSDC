# OBSOLETO: aponta para newsdcdefesa/newsdc (inexistentes) e Dockerfile frankenphp. Alvo real: sdcdefesa / acrdefesacivil / SDC/docker/swoole/Dockerfile. Reescrever antes de reativar push.
name: Deploy newsdcdefesa

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch para deploy manual
        required: false
        default: dev

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: newsdc
  ACR_LOGIN_SERVER: newsdc.azurecr.io
  IMAGE_REPO: newsdc-app
  RESOURCE_GROUP: Defesa_Civil
  APP_SERVICE: newsdcdefesa
  DOCKERFILE: SDC/docker/frankenphp/Dockerfile
  BUILD_CONTEXT: SDC

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Compute tags
        id: tags
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH=$(echo "${GITHUB_REF##*/}" | tr '/' '-')
          echo "sha=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "version_tag=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Capture previous image (rollback target)
        id: previous
        run: |
          PREV=$(az webapp sitecontainers list -n $APP_SERVICE -g "$RESOURCE_GROUP" --query "[?isMain].image | [0]" -o tsv || echo "")
          echo "image=$PREV" >> $GITHUB_OUTPUT
          echo "Previous image: $PREV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ steps.tags.outputs.version_tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:cache,mode=max

      - name: Update SiteContainer (force pull new digest)
        run: |
          az webapp sitecontainers delete -n $APP_SERVICE -g "$RESOURCE_GROUP" --container-name main || true
          az webapp sitecontainers create \
            -n $APP_SERVICE -g "$RESOURCE_GROUP" \
            --container-name main \
            --image $ACR_LOGIN_SERVER/$IMAGE_REPO:${{ steps.tags.outputs.version_tag }} \
            --target-port 8080 --is-main true --system-assigned-identity true

      - name: Restart App Service
        run: az webapp restart -n $APP_SERVICE -g "$RESOURCE_GROUP"

      - name: Health check (retries)
        id: health
        run: |
          URL="https://${APP_SERVICE}.azurewebsites.net/health"
          for i in $(seq 1 30); do
            CODE=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Healthy after ${i} tries"
              echo "ok=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Try ${i}/30: code=$CODE"
            sleep 15
          done
          echo "ok=false" >> $GITHUB_OUTPUT
          exit 1

      - name: Rollback on failure
        if: failure() && steps.previous.outputs.image != ''
        run: |
          echo "Rolling back to: ${{ steps.previous.outputs.image }}"
          az webapp sitecontainers delete -n $APP_SERVICE -g "$RESOURCE_GROUP" --container-name main || true
          az webapp sitecontainers create \
            -n $APP_SERVICE -g "$RESOURCE_GROUP" \
            --container-name main \
            --image "${{ steps.previous.outputs.image }}" \
            --target-port 8080 --is-main true --system-assigned-identity true
          az webapp restart -n $APP_SERVICE -g "$RESOURCE_GROUP"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy Summary"
            echo "- Image: \`$ACR_LOGIN_SERVER/$IMAGE_REPO:${{ steps.tags.outputs.version_tag }}\`"
            echo "- App: https://${APP_SERVICE}.azurewebsites.net"
            echo "- Health: ${{ steps.health.outputs.ok || 'unknown' }}"
            echo "- Previous (rollback target): \`${{ steps.previous.outputs.image }}\`"
          } >> $GITHUB_STEP_SUMMARY
