; Pools dedicados: exportacao, destino HTTP lento e auditoria nao bloqueiam
; notificacoes -- nem umas as outras.

[program:laravel-worker-webhooks]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis-webhooks --queue=webhooks --sleep=1 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-webhooks.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=180
startsecs=0

[program:laravel-worker-exports]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis-low --queue=low --sleep=1 --tries=3 --max-time=3600 --timeout=600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-exports.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=660
startsecs=0

[program:laravel-worker-notificacoes]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --queue=notificacoes_urgente,notificacoes --sleep=1 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-notificacoes.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=180
startsecs=0

; Auditoria: fila propria, com mais de um processo.
;
; E o job mais frequente do sistema (ate um por requisicao) e o mais barato de
; executar. Ficava na fila 'low', atras dos certificados (timeout 600s) e com um
; unico consumidor: um certificado longo segurava a auditoria inteira e o
; backlog crescia na memoria do Redis. Perfis opostos nao dividem consumidor.
;
; numprocs=2 e o ponto de partida, nao um alvo: a metrica para mexer nele e a
; IDADE do job mais antigo da fila 'auditoria'. Se ela cresce de forma
; sustentada, o consumo nao acompanha a producao e a saida e reduzir o volume
; pela amostragem (ACTIVITY_LOG_SAMPLE_PERCENT) antes de somar processos --
; auditar mais do que se consegue gravar nao e auditoria, e backlog.
;
; --timeout=30: o job so monta um array e escreve. Passando disso ha algo errado
; (Redis ou disco travado) e segurar o processo nao ajuda.
[program:laravel-worker-auditoria]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis-auditoria --queue=auditoria --sleep=1 --tries=2 --max-time=3600 --timeout=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-auditoria.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
startsecs=0
