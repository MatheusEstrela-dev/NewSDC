; Dois pools de worker, nao um.
;
; Antes: um unico program com numprocs=4 consumindo a lista inteira em ordem de
; prioridade. Prioridade decide apenas qual e o PROXIMO job escolhido; ela nao
; interrompe o que ja esta rodando. Com 4 exports ou webhooks em retry ocupando
; os 4 processos, um job critical esperava ate um deles terminar -- ate 60s por
; job, e mais que isso com retry. Num sistema em que a fila carrega notificacao
; de alerta e reset de senha, essa latencia e inaceitavel.
;
; Agora: 2 processos reservados ao trabalho urgente, que nunca sao ocupados por
; trabalho diferivel. O total continua 4 processos para nao estourar o limite de
; 512M do servico queue no compose (medido: ~70 MB por worker PHP). Para mais
; capacidade, suba o limite de memoria do servico ANTES de aumentar numprocs.
;
; A soma das duas listas tem que cobrir TODAS as filas da aplicacao -- fila fora
; das listas vira job orfao, nunca consumido, sem erro e sem failed_jobs. As
; filas em uso vem de RequestPriority::queue() (critical, high, default,
; webhooks, low), de config('webhooks.queue.inbound') e de
; config('notificacoes.entrega.fila*'). high-throughput e legada e fica na lista
; por seguranca: consumir fila sem produtor nao custa nada.
;
; EXCECAO a regra acima: a fila "medalhao" (ETL do pipeline de dados) fica fora
; das duas listas de PROPOSITO, e nao e job orfao -- tem processo proprio em
; medalhao-worker.conf, com timeout maior. Acrescentar "medalhao" a qualquer uma
; das listas reintroduziria exatamente o problema que os dois pools resolvem:
; uma coleta HTTP longa segurando o processo e atrasando notificacao e webhook.

[program:laravel-worker-urgente]
process_name=%(program_name)s_%(process_num)02d
; --sleep=1: polling mais curto reduz a espera media quando a fila esta vazia,
; que e o estado normal desta fila. Custo em CPU e irrelevante com 2 processos.
command=php /var/www/artisan queue:work --queue=critical,high --sleep=1 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-urgente.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
startsecs=0

[program:laravel-worker-diferivel]
process_name=%(program_name)s_%(process_num)02d
; --timeout=120: job diferivel e legitimamente longo (export, relatorio). O teto
; existe para que ele termine ou morra, nunca para que fique preso.
command=php /var/www/artisan queue:work --queue=webhooks,default,low,high-throughput --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-diferivel.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
startsecs=0

[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while [ true ]; do (php /var/www/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
