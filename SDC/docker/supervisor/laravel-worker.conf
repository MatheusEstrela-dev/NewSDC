[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
; A lista de filas cobre TODAS as filas da aplicacao (RequestPriority:
; critical/high/default/low + webhooks inbound + high-throughput legada) em
; ordem de prioridade - fila fora da lista vira job orfao nunca consumido.
; `high-throughput` saiu da lista: o nome so existe em config/api.php
; ('queue.high_throughput'), que NINGUEM le, e nenhum dispatch aponta para ela.
; Estava em 2o lugar na ordem de prioridade, entao todo ciclo do worker gastava
; um BRPOP numa fila que nunca tem nada antes de chegar em webhooks/default.
;
; Filas com produtor real hoje: `default` (padrao de todos os jobs) e `low`
; (RecordActivityLog, unico onQueue literal do app). `critical`, `high` e
; `webhooks` sao alcancaveis via RequestPriority::queue() em WebhookService e
; IntegrationHubService, mas nenhum chamador passa prioridade != NORMAL -- ficam
; na lista de proposito, para quando passar.
command=php /var/www/artisan queue:work --queue=critical,high,webhooks,default,low --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
startsecs=0

[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while [ true ]; do (php /var/www/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
