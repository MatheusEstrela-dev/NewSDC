[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
; A lista de filas cobre as filas de REQUISICAO da aplicacao (RequestPriority:
; critical/high/default/low + webhooks inbound + high-throughput legada) em
; ordem de prioridade - fila fora da lista vira job orfao nunca consumido.
;
; EXCECAO: a fila "medalhao" (ETL do pipeline de dados) NAO entra aqui. Ela tem
; processo proprio em medalhao-worker.conf, com timeout maior. Acrescentar
; "medalhao" nesta lista reintroduziria o problema que a separacao resolve:
; coleta longa segurando o worker e atrasando notificacao e webhook.
command=php /var/www/artisan queue:work --queue=critical,high,high-throughput,webhooks,default,low --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
startsecs=0

[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while [ true ]; do (php /var/www/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
