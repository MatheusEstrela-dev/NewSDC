; Dois workers urgentes e um geral. Webhooks, notificacoes e exports usam
; isolated-workers.conf; o ETL usa medalhao-worker.conf. Sete processos no total.
; Cada consumidor seleciona a conexao com retry_after maior que seu timeout.

[program:laravel-worker-urgente]
process_name=%(program_name)s_%(process_num)02d
; --sleep=1: polling mais curto reduz a espera media quando a fila esta vazia,
; que e o estado normal desta fila. Custo em CPU e irrelevante com 2 processos.
command=php /var/www/artisan queue:work redis-critical --queue=critical,high --sleep=1 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-urgente.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
startsecs=0

[program:laravel-worker-diferivel]
process_name=%(program_name)s_%(process_num)02d
; Trabalho geral; exports e chamadas externas possuem consumidores dedicados.
command=php /var/www/artisan queue:work redis --queue=default,high-throughput --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker-diferivel.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
startsecs=0

[program:laravel-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while [ true ]; do (php /var/www/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=60
