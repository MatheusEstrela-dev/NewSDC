[program:medalhao-worker]
process_name=%(program_name)s_%(process_num)02d
; Processo SEPARADO do laravel-worker de proposito. O ETL do medalhao nao pode
; entrar na lista de filas daquele worker: um job de coleta que leve minutos
; seguraria o processo e atrasaria notificacao e webhook, e o --timeout=60 de la
; e curto demais para ingestao. Fila dedicada + timeout proprio isolam os dois.
command=php /var/www/artisan queue:work --queue=medalhao --sleep=5 --tries=3 --max-time=3600 --timeout=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
; 1 processo basta: as coletas sao poucas e espacadas. Aumentar aqui so faz
; sentido quando entrar fonte com muitas paginas (ex.: CEMADEN SALVAR).
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/medalhao-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; Maior que o --timeout do job, para o supervisor nao matar coleta em andamento
; durante o deploy.
stopwaitsecs=360
startsecs=0
