[program:videos-worker]
process_name=%(program_name)s_%(process_num)02d
; Fila e servico PROPRIOS de proposito. A transcodificacao FFmpeg de uma aula
; leva de minutos a horas e consome CPU inteira: no mesmo worker do
; laravel-worker ela seguraria notificacao e webhook, e o --timeout=60 de la
; mataria o job. Fila dedicada + timeout proprio + servico com teto de CPU
; (queue-videos) isolam a transcodificacao do resto da fila.
command=php /var/www/artisan queue:work redis-videos --queue=videos --sleep=5 --tries=3 --max-time=7200 --timeout=3600
autostart=true
autorestart=true
stopasgroup=false
killasgroup=true
user=www-data
; 1 processo: cada FFmpeg ja ocupa o orcamento de CPU do servico.
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/videos-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; Parada: o SIGTERM vai so ao worker do Laravel (stopasgroup=false), que
; termina o video em andamento e sai. Ele tem ate 15 min (stopwaitsecs); passou
; disso e morto com SIGKILL no grupo todo (killasgroup=true, sem FFmpeg orfao) e
; o job volta para a fila depois do retry_after, contando uma tentativa. O
; stop_grace_period do servico (16m) cobre este tempo.
stopwaitsecs=900
startsecs=0
