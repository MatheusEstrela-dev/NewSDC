# ============================================================================
# SDC - Docker Compose ON-PREMISE (VM 8 vCores / 16 GB - tudo na mesma VM)
# Octane/Swoole + PostgreSQL/PostGIS + Redis + Queue + Reverb + Caddy
# ----------------------------------------------------------------------------
# ORCAMENTO DA VM (limites explicitos; a soma cabe nos 8c/16G com folga p/ SO):
#   app    3.5 cpu / 4.5G   (12 workers HTTP + 4 task; queue embutido OFF)
#   queue  1.0 cpu / 1.5G   (supervisor: 4 workers + scheduler)
#   reverb 0.5 cpu / 512M   (WebSocket - notificacoes em tempo real)
#   db     2.0 cpu / 4G     (tuning em postgres/onprem.conf)
#   redis  0.5 cpu / 1.25G  (maxmemory 1gb, volatile-lru)
#   caddy  0.5 cpu / 256M   (TLS + proxy)
#   sobra ~0.5 cpu / ~4G para SO/Docker/page cache
#
# Guardrail PG: (12 + 4 + 0)*1 + 5 externas + 5 reserva = 26 <= 100. O
# entrypoint aborta o boot se a conta estourar.
#
# Uso:  cd docker && docker compose -f compose.onprem.yml --env-file .env.onprem up -d
#       (copie .env.onprem.example -> .env.onprem e preencha os segredos)
# ============================================================================

name: sdc-onprem

x-app-build: &app-build
  context: ..
  dockerfile: docker/swoole/Dockerfile

services:
  # ==========================================================================
  # APP - Laravel Octane sobre Swoole (12 workers + 4 task workers)
  # 12 workers = 1.5x os ~8 vCores da VM (I/O bound, hooks off); mais que isso
  # vira thrash de CPU porque o Postgres/Redis moram na MESMA maquina.
  # ==========================================================================
  app:
    build: *app-build
    image: sdc/app:${VERSION:-latest}
    restart: always
    hostname: app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_NAME: ${APP_NAME:-SDC - Sistema de Defesa Civil}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      # Octane / Swoole. OCTANE_WORKERS explicito: NAO depender do
      # OCTANE_WORKER_MULTIPLIER (3x nproc = 24 workers numa VM de 8 cores).
      # MAX_REQUESTS=1000: recicla workers com metade da frequencia do default
      # (menos CPU de re-boot sob carga; memoria e vigiada pelo 'garbage' do
      # Octane e pelo limite do container).
      OCTANE_SERVER: swoole
      OCTANE_HTTPS: "true"
      OCTANE_WORKERS: "12"
      OCTANE_TASK_WORKERS: "4"
      OCTANE_MAX_REQUESTS: "1000"
      PORT: "8000"

      # Queue worker embutido OFF: o container 'queue' dedicado consome as
      # filas; um segundo worker aqui so gastaria CPU/RAM/conexao PG.
      START_EMBEDDED_QUEUE: "false"

      # Guardrail de conexoes PG: (12 + 4 + 0)*1 + 5 + 5 = 26 <= 100.
      PG_MAX_CONNECTIONS: "100"
      APP_INSTANCES: "1"
      EXTERNAL_DB_CONSUMERS: "5"

      # Banco (PostgreSQL/PostGIS local)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      DB_PERSISTENT: "false"

      # Redis (rede interna). REDIS_PREFIX identico ao do queue.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_SCHEME: tcp
      REDIS_PREFIX: ${REDIS_PREFIX:-sdc_onprem_}
      CACHE_PREFIX: ${CACHE_PREFIX:-sdc_onprem_cache_}

      CACHE_DRIVER: redis
      SESSION_DRIVER: cookie
      QUEUE_CONNECTION: redis

      # Broadcasting via Reverb (notificacoes em tempo real). O canal
      # 'broadcast' da GeneralNotification so ativa quando o default e reverb.
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http

      # Token do endpoint de metricas (GET /api/health/metrics).
      METRICS_TOKEN: ${METRICS_TOKEN}

      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - app_storage:/var/www/storage/app
      - ./logs/app:/var/www/storage/logs

    networks:
      - sdc_internal
      - sdc_edge

    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 4.5G
        reservations:
          cpus: "1"
          memory: 1G

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================================================
  # QUEUE - Workers + Scheduler (Supervisor: numprocs=4 + laravel-scheduler)
  # ==========================================================================
  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.queue
    image: sdc/queue:${VERSION:-latest}
    restart: always
    hostname: queue

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_PREFIX: ${REDIS_PREFIX:-sdc_onprem_}
      CACHE_PREFIX: ${CACHE_PREFIX:-sdc_onprem_cache_}
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Jobs que disparam notificacoes precisam broadcastar pelo mesmo Reverb.
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http

    volumes:
      - app_storage:/var/www/storage/app
      - ./logs/queue:/var/www/storage/logs

    networks:
      - sdc_internal

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 256M

    healthcheck:
      test: ["CMD", "supervisorctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # REVERB - WebSocket server (Laravel Reverb) para notificacoes em tempo real
  # Mesma imagem do app; processo dedicado. Exposto na porta 8080 da VM.
  # Alternativa: remover 'ports' e proxyar /app + /apps pelo Caddy (wss no 443).
  # ==========================================================================
  reverb:
    image: sdc/app:${VERSION:-latest}
    restart: always
    hostname: reverb

    depends_on:
      redis:
        condition: service_healthy

    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_PREFIX: ${REDIS_PREFIX:-sdc_onprem_}
      CACHE_DRIVER: redis
      # DB so para autorizar canais privados (auth via app; aqui e defensivo)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable

    ports:
      - "8080:8080"

    networks:
      - sdc_internal
      - sdc_edge

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # DB - PostgreSQL 18 + PostGIS 3.6 (tuning para 4G em postgres/onprem.conf)
  # ==========================================================================
  db:
    image: postgis/postgis:18-3.6-alpine
    restart: always
    hostname: db

    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

    environment:
      POSTGRES_DB: ${DB_DATABASE:-sdc}
      POSTGRES_USER: ${DB_USERNAME:-sdc}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/onprem.conf:/etc/postgresql/postgresql.conf:ro
      - ./logs/postgres:/var/log/postgresql

    networks:
      - sdc_internal

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sdc} -d ${DB_DATABASE:-sdc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # REDIS - Cache / Queue. volatile-lru (NAO allkeys-lru): chaves de fila e
  # estruturas sem TTL nunca sao evictadas; so cache com TTL sai sob pressao.
  # ==========================================================================
  redis:
    image: redis:7-alpine
    restart: always
    hostname: redis

    command: >
      redis-server
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    networks:
      - sdc_internal

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1.25G

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # EDGE - Caddy (TLS + proxy reverso para o Octane)
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    restart: always
    hostname: caddy

    depends_on:
      - app

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - sdc_edge

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  sdc_internal:
    driver: bridge
    internal: true
  sdc_edge:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
