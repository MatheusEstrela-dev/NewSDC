# ============================================================================
# Prometheus Alert Rules - Critical Services
# ============================================================================

groups:
  - name: services_critical
    interval: 30s
    rules:
      - alert: DeadMansSwitch
        expr: vector(1)
        labels:
          severity: none
          category: healthcheck
        annotations:
          summary: "Sistema de monitoramento esta vivo"
          description: "Este alerta sempre dispara. Se parar, o Prometheus caiu."

      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Servico {{ $labels.job }} esta DOWN"
          description: "Target {{ $labels.instance }} nao responde ha 2 minutos."

      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "PostgreSQL esta DOWN"
          description: "Banco de dados indisponivel."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Redis esta DOWN"
          description: "Cache, sessoes e filas indisponiveis."

      - alert: HealthCheckFailing
        expr: probe_success{probe_type="health_check"} == 0
        for: 3m
        labels:
          severity: critical
          category: health
        annotations:
          summary: "Health check falhando em {{ $labels.instance }}"
          description: "Endpoint de saude nao retornou HTTP 2xx."

      - alert: RedisCacheHitRateLow
        expr: (redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total)) * 100 < 80
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Taxa de cache hit baixa"
          description: "Apenas {{ $value | humanizePercentage }} das consultas atingiram cache."

      - alert: ContainerHighCPU
        expr: sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name) * 100 > 80
        for: 10m
        labels:
          severity: warning
          category: containers
        annotations:
          summary: "Container {{ $labels.name }} com CPU alta"
          description: "CPU em {{ $value | humanizePercentage }}."

      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 90
        for: 5m
        labels:
          severity: critical
          category: containers
        annotations:
          summary: "Container {{ $labels.name }} com memoria alta"
          description: "Usando {{ $value | humanizePercentage }} do limite."

      - alert: ContainerRestarting
        expr: rate(container_last_seen{name!=""}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          category: containers
        annotations:
          summary: "Container {{ $labels.name }} reiniciando"
          description: "Container esta em restart loop."
