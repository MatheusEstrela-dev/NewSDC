# ============================================================================
# Prometheus Alert Rules - Golden Signals
# Latency, errors and saturation without web-server-specific metrics.
# ============================================================================

groups:
  - name: golden_signals
    interval: 30s
    rules:
      - alert: HighResponseTime
        expr: probe_duration_seconds{probe_type=~"http|health_check"} > 1
        for: 5m
        labels:
          severity: warning
          signal: latency
        annotations:
          summary: "Alta latencia detectada"
          description: "Probe {{ $labels.instance }} demorando mais de 1 segundo."

      - alert: HTTPProbeFailed
        expr: probe_success{probe_type=~"http|health_check"} == 0
        for: 3m
        labels:
          severity: critical
          signal: errors
        annotations:
          summary: "Probe HTTP falhando"
          description: "Probe {{ $labels.instance }} nao retornou HTTP 2xx."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          signal: saturation
        annotations:
          summary: "Uso de memoria acima de 85%"
          description: "Memoria em {{ $value | humanizePercentage }} - risco de OOM."

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          signal: saturation
        annotations:
          summary: "CPU acima de 80%"
          description: "CPU em {{ $value | humanizePercentage }} nos ultimos 10 minutos."

      - alert: DiskSpaceRunningOut
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: critical
          signal: saturation
        annotations:
          summary: "Disco com menos de 15% livre"
          description: "Apenas {{ $value | humanizePercentage }} de espaco disponivel."
