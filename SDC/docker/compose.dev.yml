# ============================================================================
# SDC - Compose DEV self-contained (Swoole + PG18+PostGIS + Redis + Mailhog)
#
# Uso (da raiz NewSDC/):
#   just dev-build       # primeira vez (build da imagem)
#   just dev-up
#   just dev-status
#   just dev-logs
#
# App:     http://localhost:8000
# Mailhog: http://localhost:8025
# Postgres host:5434  Redis host:6380
#
# Vite roda no HOST em http://localhost:8081 (just dev-vite), nao neste compose.
# ============================================================================

name: newsdc-dev

services:
  app:
    build:
      context: ..                            # raiz SDC/
      dockerfile: docker/swoole/Dockerfile
      # Proxy corporativo no build (pecl/apk/composer). O compose NAO repassa
      # o proxy do shell sozinho; com default vazio vira no-op fora da rede.
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: newsdc-swoole-dev:latest
    container_name: newsdc_dev_app
    hostname: app
    restart: unless-stopped

    # Teto de memoria por servico. Sem teto, um leak nos workers cresce ate a VM
    # inteira e o OOM killer do kernel escolhe a vitima por heuristica -- que
    # frequentemente e o Postgres, o unico processo com estado. Com teto, quem
    # estoura e quem vazou.
    #
    # mem_limit e TETO DE CONTENCAO, nao reserva: o Docker nao aloca nada
    # antecipado e a soma dos limites pode passar da RAM do host. Existe para que
    # um leak morra aqui em vez de o OOM killer escolher o Postgres, que e o
    # unico processo com estado.
    #
    # Custo de memoria MEDIDO em dois pontos (cgroup memory.current, nao soma de
    # RSS -- RSS conta as paginas compartilhadas por copy-on-write uma vez por
    # processo e superestima 43% nesta escala):
    #
    #   16 processos (12 HTTP + 4 task) ->  811 MB
    #   56 processos (40 HTTP + 16 task) -> 1652 MB
    #
    # Resolvendo os dois pontos: 475 MB de base compartilhada (binario do PHP,
    # opcache) + 21 MB por processo. O modelo previu 1651 MB contra 1652 medido.
    #
    # Logo memoria NAO e o fator limitante: 4g comportaria ~168 workers. O teto
    # real e o ConnectionSemaphore (60). 4g e o teto de leak com folga de 2.4x
    # sobre o uso medido, nao um alvo de consumo.
    mem_limit: 4g

    environment:
      WORKDIR: /var/www
      APP_NAME: "SDC Dev"
      APP_ENV: local
      APP_DEBUG: "true"
      # Codigo entra por bind mount + git pull: regenerar o classmap no boot
      # evita 500 de classe nova ausente do autoloader da imagem (13/07).
      AUTOLOAD_REFRESH_ON_BOOT: "true"
      # APP_KEY como env do container em vez de depender so do .env montado:
      # sob carga, o recycle de workers (max_request) relia o .env via
      # bind-mount do Windows e falhava transitoriamente -> MissingAppKeyException
      # e crash do worker. Valor vem do docker/.env (gitignorado); o ":?" falha
      # o boot com mensagem clara se a chave nao estiver la.
      APP_KEY: ${APP_KEY:?APP_KEY ausente em SDC/docker/.env - copie do SDC/.env}
      # HTTP puro para permitir consumo por Power BI sem cert self-signed.
      # Porta de acesso padronizada em 8000 (externo=interno): sob port-forward
      # com portas diferentes, o Swoole ve a request na porta interna e gera URLs
      # de asset erradas (404). Com 8000:8000, request == acesso -> assets OK.
      APP_URL: http://localhost:8000

      # Octane + Swoole
      OCTANE_SERVER: swoole
      OCTANE_HTTPS: "false"
      PORT: 8000
      # 12 workers, nao 4. Com hook_flags=0 (hooks de corrotina desligados,
      # exigencia do phpredis que o ConnectionSemaphore tipa como ?Redis) cada
      # request ocupa um processo inteiro do inicio ao fim: PDO, Redis e arquivo
      # bloqueiam. Logo a capacidade de requests EM VOO e igual ao numero de
      # workers, e 4 requests lentos simultaneos (relatorio, export, chamada
      # externa) paravam a aplicacao inteira, /health incluido. Worker gasta o
      # tempo esperando o Postgres, nao queimando CPU, entao mais workers que
      # cores e correto aqui. Custo medido: ~85 MB de RSS por worker.
      # Dimensionado para OCUPAR o teto do ConnectionSemaphore (DB_MAX_CONCURRENT,
      # abaixo), nao para caber com folga. O orcamento fecha exato:
      #
      #   40 workers HTTP + 16 task workers + 2 queue + 2 de reserva = 60
      #
      # Por que ocupar o teto e nao ficar abaixo: o backpressure de
      # config/resilience.php dispara em fracao de UTILIZACAO do semaforo
      # (BP_PUBLIC_DROP=0.7 -> 42 conexoes, BP_FREE_DROP=0.9 -> 54). Com 12+4
      # workers o pico teorico era 18/60 = 30%, entao os limiares NUNCA eram
      # alcancados e a protecao ficava inerte: sob carga o sistema degradava sem
      # descartar nada. Com 58 de pico o mecanismo volta a existir.
      #
      # Requests em voo == numero de workers, porque hook_flags=0 (exigencia do
      # phpredis): cada request ocupa um processo inteiro do inicio ao fim. O
      # Swoole NAO tem worker elastico -- worker_num e fixo no boot, nao existe
      # equivalente ao pm=dynamic do PHP-FPM. Quem absorve o excedente e o
      # backpressure (descarta), nao um pool que cresce.
      OCTANE_WORKERS: 40
      # Task workers escalam COM os workers HTTP, nao independentes deles.
      # Concurrency::tasks() e sincrono do lado de quem chama: o worker HTTP fica
      # bloqueado ate wait_ms (5s) esperando resposta. O indice do PMDA e a
      # central de analises disparam 3 tasks por request cada, entao com 4 task
      # workers o pool de task saturava ANTES dos workers HTTP e o sintoma
      # aparecia como latencia, nao como fila de request.
      #
      # 16 nao cobre o pior caso (40 x 3 = 120 tasks); cobre a concorrencia real
      # esperada no indice. A metrica para mexer neste numero e o tempo gasto
      # DENTRO do Concurrency, nao o CPU.
      OCTANE_TASK_WORKERS: 16
      OCTANE_MAX_REQUESTS: 500
      DB_PERSISTENT: "false"

      # Este compose tem containers `queue` e `queue_critical` dedicados, entao o
      # worker embutido do entrypoint e um TERCEIRO consumidor competindo pelas
      # MESMAS filas (ele consome critical,high,webhooks,default,low -- tudo). O
      # proprio entrypoint.sh:186 manda desligar nesta topologia: "nao duplicar
      # consumidores nem gastar CPU/RAM/conexao PG com um segundo worker no
      # container do app". Fica true so no Azure, onde o container e unico.
      START_EMBEDDED_QUEUE: "false"

      # Ativa o guardrail de conexoes do entrypoint. Sem esta variavel ele apenas
      # imprime "guardrail de conexoes inativo" e segue -- o boot passa mesmo
      # projetando mais conexoes do que o Postgres aceita, e a falha aparece
      # depois, como "too many connections" no meio de um request.
      #
      # A conta que ele faz:
      #   (WORKERS + TASK_WORKERS + QUEUE_WORKERS) * APP_INSTANCES
      #       + EXTERNAL_DB_CONSUMERS + PG_ADMIN_RESERVE <= PG_MAX_CONNECTIONS
      #   (40 + 16 + 0) * 1 + 3 + 5 = 64  <=  100   OK
      #
      # Com isso um OCTANE_WORKERS excessivo aborta o boot com mensagem clara em
      # vez de degradar em producao. Foi o que faltou para 80 workers: a projecao
      # daria 118 e o gate barraria.
      PG_MAX_CONNECTIONS: 100
      # Os 3 containers de fila dedicados (queue, queue_critical,
      # queue_notificacoes). Somados UMA vez, nao por instancia -- o entrypoint
      # estava projetando 0 externas e subestimando o consumo real.
      EXTERNAL_DB_CONSUMERS: 3
      # Teto do ConnectionSemaphore. O default (100) era igual ao
      # max_connections do Postgres, que ainda reserva 3 para superuser: o
      # semaforo autorizava mais conexoes do que o banco aceita, e o
      # "too many connections" chegava antes de qualquer throttle. 60 deixa
      # folga para queue worker, psql de manutencao e as reservadas.
      DB_MAX_CONCURRENT: 60

      # Raiz dos anexos por modulo (bind mount do disco dedicado; ver volumes).
      # filesystems.php reponta os disks pae/rat/compdec/tdap/exports para
      # ANEXOS_ROOT/{MODULO} quando esta env existe.
      ANEXOS_ROOT: /data/anexos

      # Raiz dos anexos do RAT legado (arquivo morto). Path real no bind mount
      # (case-sensitive): /data/anexos/RAT/Legado/{id}/{arquivo}.
      LEGADO_RAT_ANEXOS_ROOT: /data/anexos/RAT/Legado

      # Em HTTP o cookie Secure nao e enviado pelo browser; sem isso o login web
      # quebra. config/session.php tem default true, entao sobrescrevemos aqui.
      SESSION_SECURE_COOKIE: "false"

      # Host base do Swagger (server URL do "Try it out"). Em HTTP para casar com
      # a origem atual; env do compose vence o .env baked na imagem.
      L5_SWAGGER_CONST_HOST: http://localhost:8000

      # Banco
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sdc
      DB_USERNAME: sdc
      DB_PASSWORD: secret
      DB_SSLMODE: disable

      # Banco legado (MySQL do Laragon no host) para o ETL do COMPDEC.
      # Le com_comdec / com_plano_upload; somente leitura, so usado por
      # migrar:compdec. host.docker.internal ja resolve via extra_hosts.
      DB_LEGACY_HOST: host.docker.internal
      DB_LEGACY_PORT: 3306
      DB_LEGACY_DATABASE: dbsdc
      DB_LEGACY_USERNAME: root
      DB_LEGACY_PASSWORD: ""

      # Redis (cache / session / queue)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SCHEME: tcp
      # phpredis (extensao C), NAO predis: o app tem App\Database\ConnectionSemaphore
      # tipado para ?Redis (phpredis). Com predis da TypeError e quebra /login e
      # /api/health. Trade-off: phpredis nao e auto-hookado pelo SWOOLE_HOOK_ALL
      # (Redis I/O bloqueia a coroutine) ate existir um RedisPool nativo (Fase 3).
      REDIS_CLIENT: phpredis
      # Prefix explicito e identico ao worker para que ambos leiam/escrevam
      # nas mesmas chaves (config/database.php deriva do APP_NAME por padrao,
      # mas o worker usa outro APP_NAME e ficaria isolado).
      REDIS_PREFIX: sdc_dev_database_
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Mail. Default: Mailhog (capturado em http://localhost:8025).
      # Para usar SMTP real (Prodemge, etc.) sobrescreva via docker/.env:
      #   MAIL_HOST=smtpprdm.prodemge.gov.br
      #   MAIL_PORT=587
      #   MAIL_USERNAME=...
      #   MAIL_PASSWORD=...
      #   MAIL_ENCRYPTION=tls
      #   MAIL_FROM_ADDRESS=sdc@defesacivil.mg.gov.br
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dev@sdc.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SDC Dev}

      # Web Push. Sem par VAPID o canal fica indisponivel para todos os usuarios
      # e CanaisDisponiveis desabilita o checkbox na tela com esse motivo -- ou
      # seja, ausencia aqui degrada, nao quebra. Gere o par com
      # `php artisan notificacoes:vapid` e ponha no docker/.env.
      # Trocar o par depois invalida todas as inscricoes ja gravadas.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:sdc@defesacivil.mg.gov.br}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}

    ports:
      - "8000:8000"     # HTTP (Swoole) — externo=interno p/ assets baterem

    # host.docker.internal so e automatico no Docker Desktop; no Linux nativo
    # precisa deste extra_hosts (host-gateway) para o app alcancar o Vite dev
    # server rodando no host (porta 8081) e nao remover o public/hot marcado
    # em AppServiceProvider::viteDevServerIsReachable().
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Codigo da app sobre o build Swoole; vendor fica na imagem.
      - ../app:/var/www/app
      - ../core:/var/www/core
      - ../bootstrap:/var/www/bootstrap
      - ../config:/var/www/config
      - ../database:/var/www/database
      - ../routes:/var/www/routes
      - ../resources:/var/www/resources
      # Sem este bind, lang/ so existia dentro da imagem: arquivo de
      # traducao criado ou editado no host nao chegava ao container
      # ate um rebuild, e as mensagens saiam como a chave crua.
      - ../lang:/var/www/lang
      - ../public:/var/www/public
      - ../tests:/var/www/tests
      - ../composer.json:/var/www/composer.json:ro
      - ../composer.lock:/var/www/composer.lock:ro
      - ../phpunit.xml:/var/www/phpunit.xml:ro
      - ../artisan:/var/www/artisan:ro
      # Storage e logs visiveis no host
      - ../storage/app:/var/www/storage/app
      - ../storage/logs:/var/www/storage/logs
      # TEMPORARIO -- validacao dos PDFs do legado Cisterna.
      # O disco 'legado_cisterna' tem root storage/app/public/legado_cisterna
      # e os caminhos gravados no banco comecam em relatorios/cisterna/.
      # Somente leitura: e fonte do refino do ETL, nunca destino.
      # Remover quando o refino tiver copiado tudo para o MediaLibrary.
      - "${LEGADO_CISTERNA_HOST_PATH:-../storage/app/public/legado_cisterna/relatorios/cisterna}:/var/www/storage/app/public/legado_cisterna/relatorios/cisterna:ro"
      # TEMPORARIO -- planos de contingencia do legado gestaocedec.
      # 618 dos 619 registros apontam para DOCUMENT_ROOT/anexo/planoCont
      # (Classe.Anexo::uploadSimple). O caminho e o 1o candidato de
      # config(compdec.legacy_paths.planos) e o download le direto dele.
      - "${LEGADO_PLANOS_HOST_PATH:-../storage/app/public/legado_planos}:/legacy/gestaocedec/anexo/planoCont:ro"
      # TEMPORARIO -- anexos do RAT arquivo morto.
      # O disco `legado_rat` NAO usa o default de filesystems.php: o proprio
      # compose define LEGADO_RAT_ANEXOS_ROOT=/data/anexos/RAT/Legado, entao e
      # ali que o bind precisa cair. Estrutura {id}/{arquivo}, igual ao legado
      # rat_uploads/{id}/.
      - "${LEGADO_RAT_HOST_PATH:-../storage/anexos/RAT/Legado}:/data/anexos/RAT/Legado:ro"
      # Anexos por modulo (PAE/RAT/COMPDEC/TDAP/EXPORTS): bind mount UNICO do
      # disco dedicado (1.2T, ext4). A separacao por modulo e subpasta logica
      # via config/filesystems.php (ANEXOS_ROOT) — modulo novo = subpasta
      # nova criada pelo Laravel, sem mexer aqui.
      - ${ANEXOS_HOST_PATH:-../storage/anexos}:/data/anexos

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Worker dedicado para Redis queues (welcome mail, reset password, webhooks,
  # exports async, notifications). Sem ele, Mail::queue/dispatch ficam parados
  # no Redis indefinidamente. Compartilha a imagem do app e bind-mounts.
  queue:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_dev_queue
    hostname: queue
    restart: unless-stopped

    # 768m e nao 512m: o dump-autoload do boot (11.5k classes) e o pico de
    # memoria deste container, nao o worker em si (~110 MB em regime).
    mem_limit: 768m

    # Mesmo racional do app: sem isso o boot do worker conclui que o Vite dev
    # server e inalcancavel e apaga o public/hot compartilhado (bind mount).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment: &queue-env
      WORKDIR: /var/www
      APP_NAME: "SDC Dev Queue"
      # Mesmo racional do servico app: APP_KEY via env, nao via .env montado.
      APP_KEY: ${APP_KEY:?APP_KEY ausente em SDC/docker/.env - copie do SDC/.env}
      APP_ENV: local
      APP_DEBUG: "true"
      # Mesmo racional do app: classmap regenerado no boot (bind mount + pull).
      AUTOLOAD_REFRESH_ON_BOOT: "true"
      # Mesma origem HTTP do app, para links gerados em jobs/emails baterem.
      APP_URL: http://localhost:8000

      # Mesma raiz de anexos do app (jobs de export gravam no disk 'exports').
      ANEXOS_ROOT: /data/anexos
      LEGADO_RAT_ANEXOS_ROOT: /data/anexos/RAT/Legado

      # Banco (compartilhado com app)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sdc
      DB_USERNAME: sdc
      DB_PASSWORD: secret
      DB_SSLMODE: disable

      # Redis (cache / session / queue)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SCHEME: tcp
      # phpredis (igual ao app) — ConnectionSemaphore exige ?Redis.
      REDIS_CLIENT: phpredis
      # MESMO prefix do app — sem isso o worker leria de outra keyspace
      # (sdc_dev_queue_database_*) e os jobs ficariam parados.
      REDIS_PREFIX: sdc_dev_database_
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Mail. Mesmo default do app (Mailhog) — sobrescreva no docker/.env
      # se quiser testar SMTP real (Prodemge) localmente.
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dev@sdc.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SDC Dev}

      # Web Push. Precisa estar aqui tambem, e nao so no app: quem fala com o
      # push service e o EnviarWebPushJob, que roda NESTE container.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:sdc@defesacivil.mg.gov.br}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}

    volumes: &queue-volumes
      # Bind-mount identico ao app; vendor fica na imagem.
      - ../app:/var/www/app
      - ../core:/var/www/core
      - ../bootstrap:/var/www/bootstrap
      - ../config:/var/www/config
      - ../database:/var/www/database
      - ../routes:/var/www/routes
      - ../resources:/var/www/resources
      # Sem este bind, lang/ so existia dentro da imagem: arquivo de
      # traducao criado ou editado no host nao chegava ao container
      # ate um rebuild, e as mensagens saiam como a chave crua.
      - ../lang:/var/www/lang
      - ../public:/var/www/public
      - ../tests:/var/www/tests
      - ../composer.json:/var/www/composer.json:ro
      - ../composer.lock:/var/www/composer.lock:ro
      - ../phpunit.xml:/var/www/phpunit.xml:ro
      - ../artisan:/var/www/artisan:ro
      # Storage e logs visiveis no host
      - ../storage/app:/var/www/storage/app
      - ../storage/logs:/var/www/storage/logs
      # Mesmo bind mount de anexos do app (ver comentario no servico app).
      - ${ANEXOS_HOST_PATH:-../storage/anexos}:/data/anexos

    depends_on: &queue-depends
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Regenera o autoloader ANTES de subir o worker. A imagem baka um classmap
    # --classmap-authoritative no build (Dockerfile), que NAO inclui modulos
    # adicionados depois (ex.: app/Modules/Pmda) -- esses chegam so via bind-mount
    # em runtime. Sob classmap-authoritative o PSR-4 fallback fica off, entao o
    # worker boota com classmap stale e quebra ("Class ... not found"). O app
    # passa pelo /start.sh; o queue sobrescreve o CMD e pularia essa etapa.
    # dump-autoload --optimize (sem -a) reconstroi o classmap e reativa o PSR-4
    # fallback, fazendo o worker enxergar os modulos montados.
    # Este worker consome apenas o trabalho DIFERIVEL. As filas critical e high
    # sairam daqui para o servico queue_critical: um unico processo consumindo
    # as cinco filas em ordem de prioridade e sequencial, entao um export
    # pesado ou um webhook em retry (ate 60s cada) segurava a fila critical
    # atras dele. Prioridade so decide a ordem de escolha do PROXIMO job, nao
    # interrompe o que esta em execucao -- num sistema onde a fila carrega
    # notificacao de alerta, isso e latencia inaceitavel.
    # --timeout=120: job diferivel pode ser longo (export, relatorio).
    # --max-time=3600: restart de hora em hora para evitar memory leak.
    # --tries=2: jobs com $tries proprio (export, webhook) sobrescrevem.
    # A guarda do marcador replica o /start.sh (este command sobrescreve o CMD
    # da imagem, entao a checagem de mount do entrypoint nao rodaria aqui).
    command:
      - sh
      - -c
      - >
        if [ -n "$${ANEXOS_ROOT:-}" ] && [ ! -e "$${ANEXOS_ROOT}/.sdc_storage_mounted" ]; then
        echo "ERRO: ANEXOS_ROOT sem o marcador .sdc_storage_mounted (disco de anexos nao montado no host?)" && exit 1;
        fi &&
        umask 002 &&
        composer dump-autoload --optimize --no-interaction &&
        exec php artisan queue:work redis
        --queue=default,webhooks,low
        --tries=2 --timeout=120 --max-time=3600 --sleep=3

    healthcheck: &queue-healthcheck
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker dedicado ao trabalho URGENTE (critical, high). Processo separado para
  # que job diferivel nao possa atrasa-lo: e a fila que carrega notificacao de
  # alerta e e-mail de reset de senha. --sleep=1 em vez de 3 reduz a espera
  # media de polling quando a fila esta vazia.
  queue_critical:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_dev_queue_critical
    hostname: queue-critical
    restart: unless-stopped

    mem_limit: 768m

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      <<: *queue-env
      APP_NAME: "SDC Dev Queue Critical"

    volumes: *queue-volumes

    depends_on: *queue-depends

    command:
      - sh
      - -c
      - >
        if [ -n "$${ANEXOS_ROOT:-}" ] && [ ! -e "$${ANEXOS_ROOT}/.sdc_storage_mounted" ]; then
        echo "ERRO: ANEXOS_ROOT sem o marcador .sdc_storage_mounted (disco de anexos nao montado no host?)" && exit 1;
        fi &&
        umask 002 &&
        composer dump-autoload --optimize --no-interaction &&
        exec php artisan queue:work redis
        --queue=critical,high
        --tries=2 --timeout=60 --max-time=3600 --sleep=1

    healthcheck: *queue-healthcheck

  # Worker exclusivo das notificacoes (push e e-mail).
  #
  # Existe por causa de head-of-line blocking. O fan-out de uma notificacao para
  # mil pessoas enfileirava mil jobs de I/O de rede; em `default`, com UM worker,
  # isso segurava export, webhook e e-mail de reset de senha atras deles por
  # minutos. Aqui uma rajada de notificacao so atrasa outra notificacao.
  #
  # As duas filas no mesmo processo, nesta ordem: alerta urgente passa na frente
  # do aviso de rotina sem custar um container a mais. Os nomes vem de
  # config/notificacoes.php (entrega.fila / entrega.fila_urgente).
  #
  # --timeout=120: o job de push fala com FCM/Mozilla/WNS e, no pior caso, cai
  # para envio individual por dispositivo.
  queue_notificacoes:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_dev_queue_notificacoes
    hostname: queue-notificacoes
    restart: unless-stopped

    mem_limit: 768m

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      <<: *queue-env
      APP_NAME: "SDC Dev Queue Notificacoes"

    volumes: *queue-volumes

    depends_on: *queue-depends

    command:
      - sh
      - -c
      - >
        if [ -n "$${ANEXOS_ROOT:-}" ] && [ ! -e "$${ANEXOS_ROOT}/.sdc_storage_mounted" ]; then
        echo "ERRO: ANEXOS_ROOT sem o marcador .sdc_storage_mounted (disco de anexos nao montado no host?)" && exit 1;
        fi &&
        umask 002 &&
        composer dump-autoload --optimize --no-interaction &&
        exec php artisan queue:work redis
        --queue=notificacoes_urgente,notificacoes
        --tries=2 --timeout=120 --max-time=3600 --sleep=1

    healthcheck: *queue-healthcheck

  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: newsdc_dev_db
    hostname: db
    restart: unless-stopped

    # shared_buffers default e 128 MB; 1g cobre isso mais work_mem por conexao.
    mem_limit: 1g

    # Mesmos flags do docker-compose.yml (producao). Sem pg_stat_statements nao
    # existe resposta para "qual consulta esta segurando o worker" -- e a primeira
    # coisa que se olha quando a aplicacao trava. Nao se diagnostica o que nao se
    # mede, e ligar depois exige restart do cluster (shared_preload_libraries).
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c track_activity_query_size=2048

    environment:
      POSTGRES_USER: sdc
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sdc
    ports:
      - "5434:5432"       # 5434 no host (5433 costuma estar ocupado pela stack legada db_ai)
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdc -d sdc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cluster do backup 2026-07-27 restaurado lado a lado (somente conferencia e
  # reimportacao de dados). Schema pre-Cisterna: nao usar como banco da aplicacao.
  db_bkp:
    image: postgis/postgis:18-3.6-alpine
    container_name: newsdc_dev_db_bkp
    hostname: db_bkp
    restart: unless-stopped

    mem_limit: 512m
    environment:
      POSTGRES_USER: sdc
      POSTGRES_DB: sdc
    ports:
      - "5435:5432"       # 5435 no host (5434 e o db de desenvolvimento)
    volumes:
      - pgdata_bkp2607:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdc -d sdc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: newsdc_dev_redis
    hostname: redis
    restart: unless-stopped

    # 640m = maxmemory 512m + folga para AOF e overhead do proprio Redis.
    mem_limit: 640m
    # volatile-lru, nao allkeys-lru: cache, sessao e FILA moram na mesma
    # instancia. Sob allkeys-lru (o que o docker-compose.yml de producao usa) o
    # Redis pode evictar qualquer chave quando enche -- inclusive as listas de
    # job, fazendo notificacao enfileirada desaparecer sem erro em log nenhum.
    # volatile-lru so evicta chave COM TTL, e as listas de fila do Laravel nao
    # tem TTL: cache e sessao cedem primeiro, job nunca. Com o teto atingido e
    # nada volatil para liberar, a escrita falha alto -- que e o comportamento
    # desejado num sistema onde alerta perdido e pior que erro visivel.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "6380:6379"       # 6380 no host
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: newsdc_dev_mailhog
    hostname: mailhog
    restart: unless-stopped

    mem_limit: 128m
    ports:
      - "1025:1025"       # SMTP
      - "8025:8025"       # UI

volumes:
  pgdata:
  pgdata_bkp2607:
  redisdata:
