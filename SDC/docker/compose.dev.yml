# ============================================================================
# SDC - Compose DEV self-contained (Swoole + PG18+PostGIS + Redis + Mailhog)
#
# Uso (da raiz NewSDC/):
#   just dev-build       # primeira vez (build da imagem)
#   just dev-up
#   just dev-status
#   just dev-logs
#
# App:     http://localhost:8000
# Mailhog: http://localhost:8025
# Postgres host:5433  Redis host:6380
#
# Vite roda no HOST em http://localhost:8081 (just dev-vite), nao neste compose.
# ============================================================================

name: newsdc-dev

services:
  app:
    build:
      context: ..                            # raiz SDC/
      dockerfile: docker/swoole/Dockerfile
    image: newsdc-swoole-dev:latest
    container_name: newsdc_dev_app
    hostname: app
    restart: unless-stopped

    environment:
      WORKDIR: /var/www
      APP_NAME: "SDC Dev"
      APP_ENV: local
      APP_DEBUG: "true"
      # HTTP puro para permitir consumo por Power BI sem cert self-signed.
      # Porta de acesso padronizada em 8000 (externo=interno): sob port-forward
      # com portas diferentes, o Swoole ve a request na porta interna e gera URLs
      # de asset erradas (404). Com 8000:8000, request == acesso -> assets OK.
      APP_URL: http://localhost:8000

      # Octane + Swoole
      OCTANE_SERVER: swoole
      OCTANE_HTTPS: "false"
      PORT: 8000
      OCTANE_WORKERS: 4
      OCTANE_TASK_WORKERS: 4
      OCTANE_MAX_REQUESTS: 500
      DB_PERSISTENT: "false"

      # Em HTTP o cookie Secure nao e enviado pelo browser; sem isso o login web
      # quebra. config/session.php tem default true, entao sobrescrevemos aqui.
      SESSION_SECURE_COOKIE: "false"

      # Host base do Swagger (server URL do "Try it out"). Em HTTP para casar com
      # a origem atual; env do compose vence o .env baked na imagem.
      L5_SWAGGER_CONST_HOST: http://localhost:8000

      # Banco
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sdc
      DB_USERNAME: sdc
      DB_PASSWORD: secret
      DB_SSLMODE: disable

      # Redis (cache / session / queue)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SCHEME: tcp
      # phpredis (extensao C), NAO predis: o app tem App\Database\ConnectionSemaphore
      # tipado para ?Redis (phpredis). Com predis da TypeError e quebra /login e
      # /api/health. Trade-off: phpredis nao e auto-hookado pelo SWOOLE_HOOK_ALL
      # (Redis I/O bloqueia a coroutine) ate existir um RedisPool nativo (Fase 3).
      REDIS_CLIENT: phpredis
      # Prefix explicito e identico ao worker para que ambos leiam/escrevam
      # nas mesmas chaves (config/database.php deriva do APP_NAME por padrao,
      # mas o worker usa outro APP_NAME e ficaria isolado).
      REDIS_PREFIX: sdc_dev_database_
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Mail. Default: Mailhog (capturado em http://localhost:8025).
      # Para usar SMTP real (Prodemge, etc.) sobrescreva via docker/.env:
      #   MAIL_HOST=smtpprdm.prodemge.gov.br
      #   MAIL_PORT=587
      #   MAIL_USERNAME=...
      #   MAIL_PASSWORD=...
      #   MAIL_ENCRYPTION=tls
      #   MAIL_FROM_ADDRESS=sdc@defesacivil.mg.gov.br
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dev@sdc.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SDC Dev}

    ports:
      - "8000:8000"     # HTTP (Swoole) — externo=interno p/ assets baterem

    volumes:
      # Codigo da app sobre o build Swoole; vendor fica na imagem.
      - ../app:/var/www/app
      - ../core:/var/www/core
      - ../bootstrap:/var/www/bootstrap
      - ../config:/var/www/config
      - ../database:/var/www/database
      - ../routes:/var/www/routes
      - ../resources:/var/www/resources
      - ../public:/var/www/public
      - ../tests:/var/www/tests
      - ../composer.json:/var/www/composer.json:ro
      - ../composer.lock:/var/www/composer.lock:ro
      - ../phpunit.xml:/var/www/phpunit.xml:ro
      - ../artisan:/var/www/artisan:ro
      # Storage e logs visiveis no host
      - ../storage/app:/var/www/storage/app
      - ../storage/logs:/var/www/storage/logs

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Worker dedicado para Redis queues (welcome mail, reset password, webhooks,
  # exports async, notifications). Sem ele, Mail::queue/dispatch ficam parados
  # no Redis indefinidamente. Compartilha a imagem do app e bind-mounts.
  queue:
    build:
      context: ..
      dockerfile: docker/swoole/Dockerfile
    image: newsdc-swoole-dev:latest
    container_name: newsdc_dev_queue
    hostname: queue
    restart: unless-stopped

    environment:
      WORKDIR: /var/www
      APP_NAME: "SDC Dev Queue"
      APP_ENV: local
      APP_DEBUG: "true"
      # Mesma origem HTTP do app, para links gerados em jobs/emails baterem.
      APP_URL: http://localhost:8000

      # Banco (compartilhado com app)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sdc
      DB_USERNAME: sdc
      DB_PASSWORD: secret
      DB_SSLMODE: disable

      # Redis (cache / session / queue)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SCHEME: tcp
      # phpredis (igual ao app) — ConnectionSemaphore exige ?Redis.
      REDIS_CLIENT: phpredis
      # MESMO prefix do app — sem isso o worker leria de outra keyspace
      # (sdc_dev_queue_database_*) e os jobs ficariam parados.
      REDIS_PREFIX: sdc_dev_database_
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Mail. Mesmo default do app (Mailhog) — sobrescreva no docker/.env
      # se quiser testar SMTP real (Prodemge) localmente.
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-dev@sdc.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SDC Dev}

    volumes:
      # Bind-mount identico ao app; vendor fica na imagem.
      - ../app:/var/www/app
      - ../core:/var/www/core
      - ../bootstrap:/var/www/bootstrap
      - ../config:/var/www/config
      - ../database:/var/www/database
      - ../routes:/var/www/routes
      - ../resources:/var/www/resources
      - ../public:/var/www/public
      - ../tests:/var/www/tests
      - ../composer.json:/var/www/composer.json:ro
      - ../composer.lock:/var/www/composer.lock:ro
      - ../phpunit.xml:/var/www/phpunit.xml:ro
      - ../artisan:/var/www/artisan:ro
      # Storage e logs visiveis no host
      - ../storage/app:/var/www/storage/app
      - ../storage/logs:/var/www/storage/logs

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Prioridade: critical > high > default > webhooks > low.
    # --max-time=3600: restart de hora em hora para evitar memory leak.
    # --tries=2: jobs com $tries proprio (export, webhook) sobrescrevem.
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=critical,high,default,webhooks,low
      - --tries=2
      - --timeout=60
      - --max-time=3600
      - --sleep=3

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: newsdc_dev_db
    hostname: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdc
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sdc
    ports:
      - "5433:5432"       # 5433 no host (evita colisao com legacy 5432)
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdc -d sdc"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: newsdc_dev_redis
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"       # 6380 no host
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: newsdc_dev_mailhog
    hostname: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"       # SMTP
      - "8025:8025"       # UI

volumes:
  pgdata:
  redisdata:
