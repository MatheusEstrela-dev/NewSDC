# ============================================================================
# SDC - Jenkins CI/CD ON-PREMISE (VM 10.160.131.50, atras do proxy Prodemge)
# ----------------------------------------------------------------------------
# - Jenkins master hardened (read-only, sem privileged, socket via proxy)
# - Docker socket-proxy com permissoes minimas + endpoints de Swarm liberados
#   (o pipeline usa docker service update para rolling update zero downtime)
# - Registry privado local publicado APENAS no loopback da VM (127.0.0.1:5000)
# - Backup multi-tier com verificacao
#
# Uso (recomendado, da raiz do SDC):  just prod-setup
#   O env global e o .env.prod na raiz do SDC (app + CI juntos; chaves de CI
#   listadas em ./jenkins/.env.example). Direto, sem just:
#   docker compose -f docker/jenkins/docker-compose.jenkins.yml --env-file .env.prod up -d --build
# ============================================================================

x-common-variables: &common-env
  TZ: America/Sao_Paulo

x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-http://proxy.prodemge.gov.br:8080}
  HTTPS_PROXY: ${HTTPS_PROXY:-http://proxy.prodemge.gov.br:8080}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,docker-proxy,registry,jenkins,10.160.131.50,10.0.0.0/8,.prodemge.gov.br,.mg.gov.br}
  http_proxy: ${HTTP_PROXY:-http://proxy.prodemge.gov.br:8080}
  https_proxy: ${HTTPS_PROXY:-http://proxy.prodemge.gov.br:8080}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,docker-proxy,registry,jenkins,10.160.131.50,10.0.0.0/8,.prodemge.gov.br,.mg.gov.br}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================================================
  # JENKINS MASTER
  # ==========================================================================
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
        HTTP_PROXY: ${HTTP_PROXY:-http://proxy.prodemge.gov.br:8080}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://proxy.prodemge.gov.br:8080}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.prodemge.gov.br,.mg.gov.br}
        http_proxy: ${HTTP_PROXY:-http://proxy.prodemge.gov.br:8080}
        https_proxy: ${HTTPS_PROXY:-http://proxy.prodemge.gov.br:8080}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,.prodemge.gov.br,.mg.gov.br}
    container_name: sdc_jenkins_master
    hostname: jenkins-primary
    restart: unless-stopped

    # ===== SECURITY HARDENING =====
    security_opt:
      - no-new-privileges:true
    privileged: false
    read_only: true

    tmpfs:
      - /tmp:size=512M,mode=1777
      - /var/jenkins_home/tmp:size=1G,mode=1777

    ports:
      - "8080:8080"   # Interface Web
      - "50000:50000" # Agentes JNLP

    environment:
      <<: [*common-env, *proxy-env]

      # ===== JAVA HEAP (-Xmx = ~75% do memory limit) =====
      JAVA_OPTS: >-
        -Xms512m -Xmx3g
        -Djava.awt.headless=true
        -Djenkins.install.runSetupWizard=false
        -Djenkins.model.Jenkins.slaveAgentPort=50000
        -Djenkins.model.Jenkins.slaveAgentPortEnforce=true

      # ===== DOCKER via socket-proxy (nunca montar o socket no master) =====
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_TLS_VERIFY: ""

      JENKINS_OPTS: --prefix=/

      # ===== JCasC (consumidos pelo casc.yaml) =====
      JENKINS_URL: ${JENKINS_URL:-http://10.160.131.50:8080}
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_ADMIN_EMAIL: ${JENKINS_ADMIN_EMAIL:-admin@sdc.local}
      JENKINS_OMLIOES_PASSWORD: ${JENKINS_OMLIOES_PASSWORD}
      JENKINS_MATHEUS_PASSWORD: ${JENKINS_MATHEUS_PASSWORD}
      JENKINS_PROXY_HOST: ${JENKINS_PROXY_HOST:-proxy.prodemge.gov.br}
      JENKINS_PROXY_PORT: ${JENKINS_PROXY_PORT:-8080}
      GIT_REPO_URL: ${GIT_REPO_URL:-}
      GIT_DEPLOY_BRANCH: ${GIT_DEPLOY_BRANCH:-*/main}
      GIT_SSH_PRIVATE_KEY: ${GIT_SSH_PRIVATE_KEY:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-MatheusEstrela-dev}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
      APP_HEALTH_URL: ${APP_HEALTH_URL:-https://10.160.131.50/health}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}

    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_cache_bun:/var/jenkins_home/.bun
      # .env de producao do app: lido pelo stage de Migrations
      # (docker run --env-file /opt/sdc/.env.onprem)
      - /opt/sdc:/opt/sdc:ro
      # Backups visiveis para inspecao (escrita e do backup-local)
      - jenkins_backups:/backups:ro

    networks:
      - jenkins_internal
      - jenkins_egress   # saida para GitHub/plugins via proxy Prodemge

    depends_on:
      docker-proxy:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

    logging: *default-logging

    labels:
      - "com.sdc.component=jenkins"
      - "com.sdc.environment=production"
      - "com.sdc.criticality=high"

  # ==========================================================================
  # DOCKER SOCKET PROXY
  # Evita expor /var/run/docker.sock diretamente. Endpoints de Swarm liberados
  # porque o deploy zero downtime usa docker service update/inspect.
  # ==========================================================================
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: sdc_docker_proxy
    hostname: docker-proxy
    restart: unless-stopped

    environment:
      # Build/push/run de imagens e containers efemeros (migrations, trivy)
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - BUILD=1
      - POST=1
      - INFO=1          # docker info (pre-flight: estado do Swarm)
      - DISTRIBUTION=1  # resolucao de digest no service update
      # Rolling update zero downtime (docker service update/inspect/ps)
      - SWARM=1
      - SERVICES=1
      - TASKS=1
      - NODES=1
      # Continuam bloqueados
      - COMMIT=0
      - CONFIGS=0
      - SECRETS=0
      - EXEC=0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - jenkins_internal

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging: *default-logging

  # ==========================================================================
  # REGISTRY PRIVADO LOCAL
  # Publicado APENAS no loopback da VM: sem TLS/auth mas inacessivel de fora.
  # Swarm e Jenkins referenciam 127.0.0.1:5000 (loopback e isento da regra de
  # insecure-registries do daemon). Para multi-node: TLS via Caddy + htpasswd.
  # ==========================================================================
  registry:
    image: registry:2
    container_name: sdc_registry
    hostname: registry
    restart: unless-stopped

    environment:
      <<: *common-env
      REGISTRY_STORAGE_DELETE_ENABLED: "true"

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - registry_data:/var/lib/registry

    networks:
      - jenkins_egress

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging: *default-logging

    labels:
      - "com.sdc.component=registry"
      - "com.sdc.backup=required"

  # ==========================================================================
  # JENKINS AGENT (inbound)
  # ==========================================================================
  jenkins-agent:
    image: jenkins/inbound-agent:latest-jdk17
    container_name: sdc_jenkins_agent
    hostname: jenkins-agent-01
    restart: unless-stopped

    environment:
      - JENKINS_URL=http://jenkins:8080
      - JENKINS_AGENT_NAME=docker-agent
      - JENKINS_SECRET=${JENKINS_AGENT_SECRET:-changeme}
      - JENKINS_AGENT_WORKDIR=/home/jenkins/agent

    volumes:
      - jenkins_agent_workdir:/home/jenkins/agent

    networks:
      - jenkins_internal

    depends_on:
      jenkins:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

    logging: *default-logging

  # ==========================================================================
  # BACKUP LOCAL (multi-tier com verificacao)
  # ==========================================================================
  backup-local:
    build:
      context: .
      dockerfile: Dockerfile.backup
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://proxy.prodemge.gov.br:8080}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://proxy.prodemge.gov.br:8080}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.prodemge.gov.br,.mg.gov.br}
        http_proxy: ${HTTP_PROXY:-http://proxy.prodemge.gov.br:8080}
        https_proxy: ${HTTPS_PROXY:-http://proxy.prodemge.gov.br:8080}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,.prodemge.gov.br,.mg.gov.br}
    container_name: sdc_jenkins_backup_local
    hostname: backup-local
    restart: unless-stopped

    environment:
      <<: *common-env
      BACKUP_TYPE: local
      BACKUP_SCHEDULE: "0 */6 * * *"
      BACKUP_RETENTION_DAILY: "7"
      BACKUP_RETENTION_WEEKLY: "4"
      BACKUP_RETENTION_MONTHLY: "12"
      BACKUP_VERIFY: "true"
      BACKUP_NOTIFY: "true"
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      PROMETHEUS_PUSHGATEWAY: ${PROMETHEUS_PUSHGATEWAY:-}

    volumes:
      - jenkins_home:/source:ro
      - jenkins_backups:/backups
      - ./scripts:/scripts:ro

    networks:
      - jenkins_internal

    depends_on:
      - jenkins

    command: crond -f -l 2

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last_backup_success && [ $(( $(date +%s) - $(cat /backups/last_backup_success) )) -lt 25200 ] || exit 1"]
      interval: 3600s
      timeout: 10s
      retries: 2
      start_period: 300s

    logging: *default-logging

  # ==========================================================================
  # BACKUP REMOTO (rsync/NFS on-premise; S3 opcional se houver egress)
  # ==========================================================================
  backup-remote:
    build:
      context: .
      dockerfile: Dockerfile.backup
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://proxy.prodemge.gov.br:8080}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://proxy.prodemge.gov.br:8080}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,.prodemge.gov.br,.mg.gov.br}
        http_proxy: ${HTTP_PROXY:-http://proxy.prodemge.gov.br:8080}
        https_proxy: ${HTTPS_PROXY:-http://proxy.prodemge.gov.br:8080}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,.prodemge.gov.br,.mg.gov.br}
    container_name: sdc_jenkins_backup_remote
    hostname: backup-remote
    restart: unless-stopped

    environment:
      <<: [*common-env, *proxy-env]
      BACKUP_TYPE: remote
      BACKUP_SCHEDULE: "0 2 * * *"
      BACKUP_REMOTE_TYPE: ${BACKUP_REMOTE_TYPE:-rsync}
      # Rsync (padrao on-premise)
      RSYNC_HOST: ${RSYNC_HOST:-}
      RSYNC_USER: ${RSYNC_USER:-}
      RSYNC_PATH: ${RSYNC_PATH:-/backups/jenkins}
      # S3 (somente se houver egress liberado)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-sdc-jenkins-backups}
      S3_REGION: ${S3_REGION:-us-east-1}

    volumes:
      - jenkins_backups:/backups:ro
      - backup_remote:/remote
      - ./scripts:/scripts:ro

    networks:
      - jenkins_egress

    command: crond -f -l 2

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

    healthcheck:
      test: ["CMD-SHELL", "test -f /remote/last_sync_success || exit 1"]
      interval: 3600s
      timeout: 30s
      retries: 2

    logging: *default-logging

  # ==========================================================================
  # METRICAS: sem exporter dedicado — o plugin "prometheus" do Jenkins ja
  # expoe as metricas em http://10.160.131.50:8080/prometheus (scrape direto).
  # A imagem prom/jenkins-exporter nao existe no Docker Hub.
  # ==========================================================================

# ==========================================================================
# NETWORKS
# ==========================================================================
networks:
  # Interna (Jenkins + agente + socket-proxy) - sem acesso externo.
  # Nome fixo para os containers efemeros do pipeline referenciarem.
  jenkins_internal:
    name: jenkins_internal
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/24
    labels:
      - "com.sdc.network=jenkins_internal"

  # Egress (Jenkins -> GitHub/plugins via proxy Prodemge; registry local)
  jenkins_egress:
    name: jenkins_egress
    driver: bridge
    labels:
      - "com.sdc.network=jenkins_egress"

# ==========================================================================
# VOLUMES
# ==========================================================================
volumes:
  jenkins_home:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./jenkins_home
    labels:
      - "com.sdc.volume=jenkins_home"
      - "com.sdc.backup=required"

  jenkins_cache_bun:
    driver: local

  jenkins_agent_workdir:
    driver: local
    labels:
      - "com.sdc.volume=agent_workdir"
      - "com.sdc.backup=optional"

  jenkins_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./jenkins_backups
    labels:
      - "com.sdc.volume=backups"
      - "com.sdc.backup=critical"

  backup_remote:
    driver: local

  registry_data:
    driver: local
    labels:
      - "com.sdc.volume=registry"
      - "com.sdc.backup=required"
