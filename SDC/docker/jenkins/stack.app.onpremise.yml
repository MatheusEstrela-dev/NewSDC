# ============================================================================
# SDC - Stack Swarm de APLICACAO on-premise (VM 8 vCores / 32 GB)
# Octane/Swoole + Queue + Reverb + Caddy - ciclo de vida do PIPELINE
# ----------------------------------------------------------------------------
# O banco NAO mora aqui: PostgreSQL e Redis estao em stack.data.onpremise.yml
# (stack sdc-data, isolada - o pipeline nunca a toca). Esta stack pode ser
# removida/reaplicada a vontade sem risco para os dados.
#
# Zero downtime = healthcheck + update start-first + replicas >= 2 (app).
#
# ORCAMENTO (app em 2 replicas):
#   app 2x (1.75 cpu / 2.25G) + queue 1/1.5G + reverb 0.5/512M + caddy 0.5/256M
#   transiente de update (start-first, parallelism 1): +1 app (~2.25G)
#
# Guardrail PG: (6 + 2)*2 instancias + 5 externas + 5 reserva = 26 <= 100.
#
# Uso (docker stack deploy NAO le .env; exporta antes):
#   # pre-requisitos: rede sdc_internal criada + stack sdc-data no ar
#   set -a; . /opt/sdc/.env.onprem; set +a
#   export VERSION=<tag-do-pipeline>          # ex: ab12cd3-b42
#   docker stack deploy -c stack.app.onpremise.yml --with-registry-auth sdc
#
# Depois do deploy inicial o Jenkins NAO roda stack deploy: o rolling update e
# feito por docker service update --image (ver SDC/Jenkinsfile.onprem).
# ============================================================================

version: "3.9"

services:
  # ==========================================================================
  # APP - Laravel Octane sobre Swoole. 2 replicas de 6+2 workers; menos que
  # isso o start-first abre janela de indisponibilidade.
  # ==========================================================================
  app:
    image: ${REGISTRY:-127.0.0.1:5000}/sdc-app:${VERSION:-latest}
    hostname: app

    environment:
      APP_NAME: ${APP_NAME:-SDC - Sistema de Defesa Civil}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      OCTANE_SERVER: swoole
      OCTANE_HTTPS: "true"
      OCTANE_WORKERS: "6"
      OCTANE_TASK_WORKERS: "2"
      OCTANE_MAX_REQUESTS: "1000"
      PORT: "8000"

      START_EMBEDDED_QUEUE: "false"

      # Guardrail de conexoes PG: (6 + 2)*2 + 5 + 5 = 26 <= 100.
      PG_MAX_CONNECTIONS: "100"
      APP_INSTANCES: "2"
      EXTERNAL_DB_CONSUMERS: "5"

      # Banco e Redis moram na stack sdc-data; resolucao via rede overlay
      # compartilhada (hostnames db/redis).
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      DB_PERSISTENT: "false"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_SCHEME: tcp
      REDIS_PREFIX: ${REDIS_PREFIX:-sdc_onprem_}
      CACHE_PREFIX: ${CACHE_PREFIX:-sdc_onprem_cache_}

      CACHE_DRIVER: redis
      SESSION_DRIVER: cookie
      QUEUE_CONNECTION: redis

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http

      METRICS_TOKEN: ${METRICS_TOKEN}

      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      - app_storage:/var/www/storage/app

    networks:
      - sdc_internal
      - sdc_edge

    healthcheck:
      # Sem healthcheck o Swarm marca a task como running assim que o PID 1
      # sobe e o start-first derruba o container velho cedo demais.
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s   # boot do Octane/Swoole antes de contar falhas

    deploy:
      replicas: 2
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s
        monitor: 30s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: "1.75"
          memory: 2.25G
        reservations:
          cpus: "0.5"
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================================================
  # QUEUE - Workers + Scheduler (Supervisor: numprocs=4 + laravel-scheduler)
  # stop-first: nao serve HTTP; jobs idempotentes retomam do Redis.
  # ==========================================================================
  queue:
    image: ${REGISTRY:-127.0.0.1:5000}/sdc-queue:${VERSION:-latest}
    hostname: queue

    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_PREFIX: ${REDIS_PREFIX:-sdc_onprem_}
      CACHE_PREFIX: ${CACHE_PREFIX:-sdc_onprem_cache_}
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http

    volumes:
      - app_storage:/var/www/storage/app

    networks:
      - sdc_internal

    healthcheck:
      test: ["CMD", "supervisorctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "1"
          memory: 1.5G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ==========================================================================
  # REVERB - WebSocket (notificacoes em tempo real), atras do Caddy (sem porta
  # publicada no host). stop-first: clientes WS reconectam sozinhos.
  # ==========================================================================
  reverb:
    image: ${REGISTRY:-127.0.0.1:5000}/sdc-app:${VERSION:-latest}
    hostname: reverb

    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_PREFIX: ${REDIS_PREFIX:-sdc_onprem_}
      CACHE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable

    # Sem porta publicada no host: o Reverb so e alcancado via rede overlay
    # sdc_edge, pelo Caddy (rota /app/* no Caddyfile), que serve wss:443
    # sem porta extra. VITE_REVERB_PORT deve ficar unset (bootstrap.js cai
    # no default 443 quando o scheme e https).
    networks:
      - sdc_internal
      - sdc_edge

    # A imagem sdc-app tem HEALTHCHECK embutido no Dockerfile checando
    # :8000/health (servidor Octane) - o reverb roda so a WS na 8080 e nunca
    # abre a 8000, entao herdar aquele healthcheck marca o container unhealthy
    # e o restart_policy mata em loop (20/07).
    healthcheck:
      disable: true

    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ==========================================================================
  # EDGE - Caddy (TLS + proxy reverso). mode: host preserva o IP real do
  # cliente (o ingress do Swarm mascara a origem).
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    hostname: caddy

    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host

    volumes:
      - /opt/sdc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - sdc_edge

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  # Overlay COMPARTILHADA com a stack sdc-data e com o container efemero de
  # migrations (docker network create --driver overlay --attachable sdc_internal).
  sdc_internal:
    external: true
  sdc_edge:
    driver: overlay

volumes:
  app_storage:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
