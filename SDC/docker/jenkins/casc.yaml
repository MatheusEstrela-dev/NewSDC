# ===== JENKINS CONFIGURATION AS CODE (JCasC) - ON-PREMISE =====
# Fonte unica de configuracao do Jenkins (sem init.groovy.d).
# Segredos vem do .env do compose — nunca hardcoded aqui.

jenkins:
  systemMessage: "Jenkins CI/CD on-premise - SDC (VM 10.160.131.50) - configurado via JCasC"

  numExecutors: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "omlioes"
          password: "${JENKINS_OMLIOES_PASSWORD}"
        - id: "matheus.estrela"
          password: "${JENKINS_MATHEUS_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false

  # Saida para internet SO via proxy Prodemge (autentica por IP).
  # noProxyHost: um host por linha; manter registry local e faixa interna fora
  # do proxy, senao push/pull e chamadas internas tentam sair e falham.
  proxy:
    name: "${JENKINS_PROXY_HOST:-proxy.prodemge.gov.br}"
    port: ${JENKINS_PROXY_PORT:-8080}
    noProxyHost: |-
      localhost
      127.0.0.1
      docker-proxy
      registry
      10.*
      *.prodemge.gov.br
      *.mg.gov.br

  nodes:
    - permanent:
        name: "docker-agent"
        remoteFS: "/home/jenkins/agent"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"

  globalNodeProperties:
    - envVars:
        env:
          - key: "APP_ENV"
            value: "production"
          - key: "DOCKER_BUILDKIT"
            value: "1"
          - key: "COMPOSE_DOCKER_CLI_BUILD"
            value: "1"
          # Consumidos pelo SDC/Jenkinsfile.onprem
          - key: "APP_HEALTH_URL"
            value: "${APP_HEALTH_URL:-https://10.160.131.50/health}"
          - key: "SLACK_WEBHOOK_URL"
            value: "${SLACK_WEBHOOK_URL:-}"
          - key: "TEAMS_WEBHOOK_URL"
            value: "${TEAMS_WEBHOOK_URL:-}"

unclassified:
  location:
    url: "${JENKINS_URL:-http://10.160.131.50:8080}"
    adminAddress: "${JENKINS_ADMIN_EMAIL:-admin@sdc.local}"

  timestamper:
    systemTimeFormat: "yyyy-MM-dd HH:mm:ss"

  globalDefaultFlowDurabilityLevel:
    durabilityHint: PERFORMANCE_OPTIMIZED

credentials:
  system:
    domainCredentials:
      - credentials:
          # Git via SSH (opcional; o job padrao usa HTTPS + token)
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "git-ssh-key"
              username: "git"
              description: "SSH Key for Git repositories"
              privateKeySource:
                directEntry:
                  privateKey: "${GIT_SSH_PRIVATE_KEY:-}"

          # GitHub PAT para checkout HTTPS (o polling passa pelo proxy)
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              username: "${GITHUB_USERNAME:-MatheusEstrela-dev}"
              password: "${GITHUB_TOKEN:-}"
              description: "GitHub Personal Access Token for HTTPS authentication"

          # Registry privado local. Hoje 127.0.0.1:5000 sem auth (loopback);
          # preencher quando o registry ganhar TLS + htpasswd (multi-node).
          - usernamePassword:
              scope: GLOBAL
              id: "registry-creds"
              username: "${REGISTRY_USERNAME:-}"
              password: "${REGISTRY_PASSWORD:-}"
              description: "Registry privado on-premise"

tool:
  git:
    installations:
      - name: "Default"
        home: "git"

security:
  scriptApproval:
    approvedSignatures:
      - "method groovy.json.JsonSlurper parse java.io.Reader"
      - "method groovy.json.JsonSlurper parseText java.lang.String"
      - "new groovy.json.JsonSlurper"

  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: true

jobs:
  - script: >
      folder('SDC') {
        displayName('SDC Application')
        description('CI/CD on-premise do SDC (Swarm + registry local, zero downtime)')
      }

  - script: >
      pipelineJob('SDC/deploy-onprem') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GIT_REPO_URL:-https://github.com/MatheusEstrela-dev/NewSDC.git}')
                  credentials('github-token')
                }
                branches('${GIT_DEPLOY_BRANCH:-*/main}')
              }
            }
            scriptPath('SDC/Jenkinsfile.onprem')
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
      }
