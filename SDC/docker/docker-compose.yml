# ============================================================================
# SDC - Docker Compose para DESENVOLVIMENTO
# Centralizado na pasta docker/
# ============================================================================
# Uso: cd docker && docker compose up -d
# Ou:  docker compose -f docker/docker-compose.yml up -d
# ============================================================================

name: newsdc

services:
  # ==========================================================================
  # PHP Application (Laravel + Swoole/Octane)
  # ==========================================================================
  app:
    build:
      context: ..
      dockerfile: docker/swoole/Dockerfile
    image: newsdc-swoole-app:latest
    container_name: newsdc_app
    hostname: app
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=app"

    volumes:
      # Código-fonte da aplicação
      - ../:/var/www:cached
      # Logs persistentes
      - ../storage/logs:/var/www/storage/logs
      # Assets frontend (Vite build) montados para refletir builds locais
      - ../public/build:/var/www/public/build:ro

    secrets:
      - db_password

    networks:
      - sdc_network

    depends_on:
      redis:
        condition: service_healthy

    env_file:
      - ../.env.local

    environment:
      # Diretorio de trabalho do entrypoint (Laravel esta montado em /var/www)
      WORKDIR: /var/www

      # Laravel
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:18001

      # Octane Swoole - HTTP para dev local
      OCTANE_SERVER: swoole
      OCTANE_HTTPS: "false"
      OCTANE_WORKERS: ${OCTANE_WORKERS:-4}
      OCTANE_TASK_WORKERS: ${OCTANE_TASK_WORKERS:-4}
      OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
      DB_PERSISTENT: "false"
      PORT: 8000

      # Inertia SSR
      INERTIA_SSR_ENABLED: ${INERTIA_SSR_ENABLED:-false}
      INERTIA_SSR_URL: "http://ssr:13714"

      # Database (credenciais via Docker secrets)
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Cache/Session
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Mail (Mailhog)
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025

    ports:
      - "18001:8000"     # HTTP dev local

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ==========================================================================
  # PostgreSQL 18 + PostGIS 3.6
  # ==========================================================================
  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: newsdc_db
    hostname: db
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=db"

    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c track_activity_query_size=2048

    environment:
      POSTGRES_DB: ${DB_DATABASE:-sdc}
      POSTGRES_USER: ${DB_USERNAME:-sdc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: America/Sao_Paulo
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - newsdc_db_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - sdc_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sdc} -d ${DB_DATABASE:-sdc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # PostgreSQL 17 — IA / AI (Citus + pgvector + PostGIS)
  # Servico separado do db principal (PG18+PostGIS) para isolar workloads:
  #   db     → dados geograficos/transacionais (PG18, sem gargalo)
  #   db_ai  → busca semantica por vetores, sharding Citus (PG17)
  # Nao ha conflito — Laravel roteia via conexoes pgsql vs pgsql_read.
  # ==========================================================================
  db_ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile.db_ai
    image: newsdc-db-ai:latest
    container_name: newsdc_db_ai
    hostname: db_ai
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=db_ai"

    command: >
      postgres
      -c shared_preload_libraries=citus,pg_stat_statements
      -c citus.node_conninfo='sslmode=disable'
      -c pg_stat_statements.track=all

    environment:
      POSTGRES_DB: ${DB_PGSQL_DATABASE:-sdc_ai}
      POSTGRES_USER: ${DB_PGSQL_USERNAME:-sdc}
      POSTGRES_PASSWORD: ${DB_PGSQL_PASSWORD:-secret}
      TZ: America/Sao_Paulo
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - newsdc_db_ai_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    networks:
      - sdc_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_PGSQL_USERNAME:-sdc} -d ${DB_PGSQL_DATABASE:-sdc_ai}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ==========================================================================
  # Redis (Cache/Session/Queue)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: newsdc_redis
    hostname: redis
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=redis"

    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - newsdc_redis_data:/data

    ports:
      - "16380:6379"

    networks:
      - sdc_network

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ==========================================================================
  # Mailhog (Email Testing)
  # ==========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: newsdc_mailhog
    hostname: mailhog
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=mailhog"

    ports:
      - "11026:1025"
      - "18026:8025"

    networks:
      - sdc_network

    logging:
      driver: "none"

  # ==========================================================================
  # phpMyAdmin (Profile: tools)
  # ==========================================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: newsdc_phpmyadmin
    hostname: phpmyadmin
    restart: unless-stopped
    profiles:
      - tools
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=phpmyadmin"

    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 100M

    ports:
      - "8086:80"

    networks:
      - sdc_network

    depends_on:
      - db

  # ==========================================================================
  # Redis Commander (Profile: tools)
  # ==========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: newsdc_redis_commander
    hostname: redis-commander
    restart: unless-stopped
    profiles:
      - tools
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=redis-commander"

    environment:
      REDIS_HOSTS: local:redis:6379

    ports:
      - "8087:8081"

    networks:
      - sdc_network

    depends_on:
      - redis

  # ==========================================================================
  # Queue Worker (Supervisor)
  # ==========================================================================
  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.queue
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: newsdc_queue
    hostname: queue
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=queue"

    secrets:
      - db_password

    volumes:
      - ../:/var/www:cached
      - newsdc_vendor:/var/www/vendor
      - ./logs/queue:/var/www/storage/logs

    networks:
      - sdc_network

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis

    healthcheck:
      test: [ "CMD", "supervisorctl", "status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ==========================================================================
  # Bun + Vite (Frontend Development Server)
  # ==========================================================================
  bun:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: newsdc_bun
    hostname: bun
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=bun"

    working_dir: /var/www

    volumes:
      - ../:/var/www:cached
      # Volume nomeado para node_modules (evita conflito Windows/Linux)
      - newsdc_node_modules:/var/www/node_modules

    networks:
      - sdc_network

    environment:
      NODE_ENV: development
      VITE_HOST: 0.0.0.0
      VITE_PORT: 8081

    ports:
      - "8081:8081" # Vite dev server

    # bun install no runtime para aproveitar as configuracoes de DNS
    command: sh -c "bun install && rm -rf node_modules/.vite && bun run dev -- --host 0.0.0.0 --port 8081"

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/@vite/client || exit 0" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================================
  # Inertia SSR Server (Bun — renderizacao server-side das paginas Vue)
  # Desabilitado por padrao (INERTIA_SSR_ENABLED=false). Para ativar:
  #   docker compose --profile ssr up -d ssr
  # ==========================================================================
  ssr:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: newsdc_ssr
    hostname: ssr
    restart: unless-stopped
    profiles:
      - ssr
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=ssr"

    working_dir: /var/www

    volumes:
      - ../:/var/www:cached
      - newsdc_node_modules:/var/www/node_modules

    networks:
      - sdc_network

    environment:
      NODE_ENV: production
      PORT: 13714

    ports:
      - "13714:13714"

    # Roda o bundle SSR pre-compilado com Bun. Apos mudancas de codigo, execute:
    # docker compose -f docker/docker-compose.yml exec bun bun run build
    # docker compose -f docker/docker-compose.yml restart ssr
    command: sh -c 'bun $$(ls -t bootstrap/ssr/js/ssr-*.js 2>/dev/null | head -n 1 || echo "bootstrap/ssr/js/ssr-CUw4_SZp.js")'

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ==========================================================================
  # Secrets Management - HashiCorp Vault
  # ==========================================================================
  vault:
    image: hashicorp/vault:1.15
    container_name: newsdc_vault
    hostname: vault
    restart: unless-stopped
    profiles:
      - tools
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=vault"

    cap_add:
      - IPC_LOCK

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-sdc-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://vault:8200"

    ports:
      - "18200:8200"

    volumes:
      - newsdc_vault_data:/vault/file
      - newsdc_vault_logs:/vault/logs

    networks:
      - sdc_network

    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # MONITORAMENTO - Prometheus
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: newsdc_prometheus
    hostname: prometheus
    restart: unless-stopped
    platform: linux/amd64
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.project=newsdc"
    security_opt:
      - apparmor=unconfined
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - newsdc_prometheus_data:/prometheus
    networks:
      - sdc_network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # MONITORAMENTO - Alertmanager
  # ==========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: newsdc_alertmanager
    hostname: alertmanager
    restart: unless-stopped
    platform: linux/amd64
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.project=newsdc"
    security_opt:
      - apparmor=unconfined
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    ports:
      - "19093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - newsdc_alertmanager_data:/alertmanager
    networks:
      - sdc_network
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # MONITORAMENTO - Grafana
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: newsdc_grafana
    hostname: grafana
    restart: unless-stopped
    platform: linux/amd64
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.project=newsdc"
    security_opt:
      - apparmor=unconfined
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin@123}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_SERVER_DOMAIN: localhost
      # Removido temporariamente para evitar timeout de rede:
      # GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: info
    ports:
      - "13000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - newsdc_grafana_data:/var/lib/grafana
    networks:
      - sdc_network
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # MONITORAMENTO - Node Exporter
  # ==========================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: newsdc_node_exporter
    hostname: node-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.project=newsdc"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth.*|br-.*|docker.*|lo)$$'
      - '--collector.netdev.device-exclude=^(veth.*|br-.*|docker.*|lo)$$'
    ports:
      - "19100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - sdc_network
    privileged: true

  # ==========================================================================
  # MONITORAMENTO - cAdvisor
  # ==========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: newsdc_cadvisor
    hostname: cadvisor
    restart: unless-stopped
    platform: linux/amd64
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.project=newsdc"
    security_opt:
      - apparmor=unconfined
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # - /var/lib/docker/:/var/lib/docker:ro # Commented due to read-only filesystem error
      - /dev/disk/:/dev/disk:ro
    networks:
      - sdc_network
    privileged: true
    devices:
      - /dev/kmsg

  # ==========================================================================
  # MONITORAMENTO - PostgreSQL Exporter
  # ==========================================================================
  pg-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: newsdc_pg_exporter
    hostname: pg-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.project=newsdc"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-sdc}:${DB_PASSWORD:-secret}@newsdc_db:5432/${DB_DATABASE:-sdc}?sslmode=disable"
    ports:
      - "19187:9187"
    networks:
      - sdc_network
    depends_on:
      db:
        condition: service_healthy

  # ==========================================================================
  # MONITORAMENTO - Redis Exporter
  # ==========================================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.56.0
    container_name: newsdc_redis_exporter
    hostname: redis-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.project=newsdc"
    environment:
      REDIS_ADDR: newsdc_redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "19121:9121"
    networks:
      - sdc_network

  # ==========================================================================
  # MONITORAMENTO - Blackbox Exporter
  # ==========================================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: newsdc_blackbox_exporter
    hostname: blackbox-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    labels:
      - "com.docker.compose.project=newsdc"
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    ports:
      - "19115:9115"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - sdc_network
  # ==========================================================================
  # AI - Ollama (Local LLM)
  # ==========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    hostname: ollama
    restart: unless-stopped
    profiles:
      - ollama
    labels:
      - "com.docker.compose.project=newsdc"
      - "com.docker.compose.service=ollama"
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - sdc_network
    environment:
      - OLLAMA_KEEP_ALIVE=30m
  # ==========================================================================
  # Networks
  # ==========================================================================

# ==========================================================================
# Secrets (dev = environment var; prod = Vault/external)
# ==========================================================================
secrets:
  db_password:
    environment: DB_PASSWORD

networks:
  sdc_network:
    external: true

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  newsdc_db_data:
    driver: local
  newsdc_db_ai_data:
    driver: local
  newsdc_redis_data:
    driver: local
  newsdc_vendor:
    driver: local
  newsdc_node_modules:
    driver: local
  newsdc_prometheus_data:
    driver: local
  newsdc_grafana_data:
    driver: local
  newsdc_alertmanager_data:
    driver: local
  newsdc_vault_data:
    driver: local
  newsdc_vault_logs:
    driver: local
  ollama_data:
    driver: local
