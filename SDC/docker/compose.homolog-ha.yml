# Aplicar sobre compose.homolog.yml. Nunca montar volumes ativos em dois
# containers Postgres.
# A adocao de PGDATA existente exige backup, parada do Postgres antigo,
# preparacao das roles/configuracao e PATRONI_ALLOW_EXISTING_DATA=true.
x-ha-app-image: &ha-app-image ${HA_APP_IMAGE:-newsdc-swoole-ha:latest}

x-ha-client-dependencies: &ha-client-dependencies
  db:
    condition: service_started
  db_replica_1:
    condition: service_started
  db_replica_2:
    condition: service_started
  redis:
    condition: service_started

x-ha-client-environment: &ha-client-environment
  DB_HOST: db,db_replica_1,db_replica_2
  DB_PORT: 6434
  DB_READ_ENABLED: "true"
  DB_READ_HOSTS: ${DB_READ_HOSTS:-db,db_replica_1,db_replica_2}
  DB_READ_PORT: ${DB_READ_PORT:-5432}
  SWOOLE_PG_POOL_SIZE: 2
  SWOOLE_PG_READ_POOL_SIZE: 1
  DB_CONNECT_TIMEOUT: 2
  PG_MAX_CONNECTIONS: 200
  RANKING_DB_HOST: db,db_replica_1,db_replica_2
  RANKING_DB_PORT: 6434
  RANKING_SOURCE_HOST: db,db_replica_1,db_replica_2
  RANKING_SOURCE_PORT: 6434
  # Conexao de log segue o primario pelo mesmo multi-host do Patroni; sem isto
  # herdaria LOG_DB_HOST=db da homolog e quebraria no failover.
  LOG_DB_HOST: db,db_replica_1,db_replica_2
  LOG_DB_PORT: 6434
  # Geoespacial e treinamento tambem seguem o primario pelo multi-host.
  GEO_DB_HOST: db,db_replica_1,db_replica_2
  GEO_DB_PORT: 6434
  TREINAMENTO_DB_HOST: db,db_replica_1,db_replica_2
  TREINAMENTO_DB_PORT: 6434

# sdc_powerbi e membro de BI, so para api_integracao, queue_integracao e
# queue_powerbi. Escrita (sdc_powerbi) no lider pelo multi-host 6434, igual ao
# resto; leitura e fonte de BI pelo HAProxy 6436 de qualquer membro Patroni,
# que so encaminha ao db_bi (check /health, nao /replica).
x-ha-bi-environment: &ha-bi-environment
  POWERBI_DB_HOST: db,db_replica_1,db_replica_2
  POWERBI_DB_PORT: 6434
  POWERBI_DB_READ_HOST: db,db_replica_1,db_replica_2
  POWERBI_DB_READ_PORT: 6436
  FONTE_BI_DB_HOST: db,db_replica_1,db_replica_2
  FONTE_BI_DB_PORT: 6436
  # Teto do lider com max_connections 400 no Patroni (clientes do site seguem
  # no PG_MAX_CONNECTIONS 200 da ancora acima).
  PG_MAX_CONNECTIONS: 400

x-patroni-environment: &patroni-environment
  PATRONI_SCOPE: ${PATRONI_SCOPE:-sdc-homolog}
  PATRONI_SUPERUSER_USERNAME: ${DB_USERNAME:-sdc}
  PATRONI_SUPERUSER_PASSWORD: ${DB_PASSWORD:-sdc}
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
  PATRONI_RESTAPI_USERNAME: patroni
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_API_PASSWORD:-patroni-homolog}
  PATRONI_CTL_USERNAME: patroni
  PATRONI_CTL_PASSWORD: ${PATRONI_API_PASSWORD:-patroni-homolog}
  PATRONI_ALLOW_EXISTING_DATA: ${PATRONI_ALLOW_EXISTING_DATA:-false}
  POSTGRES_DB: ${DB_DATABASE:-sdc}

x-etcd-environment: &etcd-environment
  ETCD_EMBEDDED: "true"
  ETCD_DATA_DIR: /etcd-data
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_INITIAL_CLUSTER: etcd_1=http://etcd_1:2380,etcd_2=http://etcd_2:2380,etcd_3=http://etcd_3:2380
  ETCD_INITIAL_CLUSTER_TOKEN: ${PATRONI_SCOPE:-sdc-homolog}
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_AUTO_COMPACTION_RETENTION: "1"

services:
  app:
    image: *ha-app-image
    environment: *ha-client-environment
    depends_on: !override
      <<: *ha-client-dependencies
  queue:
    image: *ha-app-image
    environment: *ha-client-environment
    depends_on: !override
      <<: *ha-client-dependencies
  queue_medalhao:
    image: *ha-app-image
    environment: *ha-client-environment
    depends_on: !override
      <<: *ha-client-dependencies
  queue_ranking:
    image: *ha-app-image
    environment: *ha-client-environment
    depends_on: !override
      <<: *ha-client-dependencies
  api_integracao:
    image: *ha-app-image
    environment:
      <<: [*ha-bi-environment, *ha-client-environment]
      # Nao usa replicas do site (mesmo valor da base, depois do merge acima).
      DB_READ_ENABLED: "false"
    depends_on: !override
      <<: *ha-client-dependencies
  queue_integracao:
    image: *ha-app-image
    environment:
      <<: [*ha-bi-environment, *ha-client-environment]
      DB_READ_ENABLED: "false"
    depends_on: !override
      <<: *ha-client-dependencies
  queue_powerbi:
    image: *ha-app-image
    environment:
      # Escrita e log no lider (6434); a conexao default pgsql le o membro de
      # BI (6436) e a fonte tem de ser standby.
      <<: [*ha-bi-environment, *ha-client-environment]
      DB_HOST: db,db_replica_1,db_replica_2
      DB_PORT: 6436
      DB_READ_ENABLED: "false"
      POWERBI_FONTE_EXIGE_STANDBY: "true"
    depends_on: !override
      <<: *ha-client-dependencies
  scheduler:
    image: *ha-app-image
    environment: *ha-client-environment
    depends_on: !override
      <<: *ha-client-dependencies
  reverb:
    image: *ha-app-image
    environment: *ha-client-environment
    depends_on: !override
      <<: *ha-client-dependencies
  pgbouncer:
    environment:
      DB_HOST: db,db_replica_1,db_replica_2
      DB_PORT: 6434
      SERVER_CONNECT_TIMEOUT: 2
      SERVER_LOGIN_RETRY: 1
      QUERY_WAIT_TIMEOUT: 15
    depends_on: !override
      db:
        condition: service_started
      db_replica_1:
        condition: service_started
      db_replica_2:
        condition: service_started

  db: &patroni-node
    image: newsdc-postgis-patroni:18-3.6-4.1.5-etcd-proxy
    build:
      context: ./patroni
      dockerfile: Dockerfile
    entrypoint: !override [/usr/local/bin/entrypoint.sh]
    command: !override [patroni, /run/patroni/patroni.yml]
    # PID 1 precisa recolher orfaos. O Patroni sobe o postmaster com fork
    # duplo, entao ele vira filho do PID 1; o supervise.py nao faz wait() em
    # quem nao criou. Sem init, o postmaster parado vira zumbi, o Patroni
    # espera para sempre ele sumir e o membro trava em "pg_rewind in
    # progress" (aconteceu no db_replica_2 em 2026-10-07).
    init: true
    user: "0:0"
    mem_limit: 4480m
    cpus: 2.25
    environment:
      <<: [*patroni-environment, *etcd-environment]
      PATRONI_NAME: db
      ETCD_NAME: etcd_1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd_1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd_1:2380
      PATRONI_RESTAPI_CONNECT_ADDRESS: db:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: db:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/18/docker
    volumes: !override
      - homolog_pgdata:/var/lib/postgresql
      - homolog_etcd_1:/etcd-data
    networks: !override
      homolog:
        aliases: [etcd_1]
    # Acesso administrativo local. Clientes internos usam os tres enderecos.
    ports: !override
      - "127.0.0.1:5435:6434"
      - "127.0.0.1:5438:6435"
    depends_on: !reset {}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8008/readiness >/dev/null && etcdctl --endpoints=http://127.0.0.1:2379 --command-timeout=2s endpoint health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8404/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    stop_grace_period: 90s

  db_replica_1:
    <<: *patroni-node
    environment:
      <<: [*patroni-environment, *etcd-environment]
      PATRONI_NAME: db_replica_1
      ETCD_NAME: etcd_2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd_2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd_2:2380
      PATRONI_RESTAPI_CONNECT_ADDRESS: db_replica_1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: db_replica_1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/pgdata
    volumes: !override
      - homolog_pgdata_replica_1:/var/lib/postgresql
      - homolog_etcd_2:/etcd-data
    networks: !override
      homolog:
        aliases: [etcd_2]
    ports: !override []

  db_replica_2:
    <<: *patroni-node
    environment:
      <<: [*patroni-environment, *etcd-environment]
      PATRONI_NAME: db_replica_2
      ETCD_NAME: etcd_3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd_3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd_3:2380
      PATRONI_RESTAPI_CONNECT_ADDRESS: db_replica_2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: db_replica_2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/pgdata
    volumes: !override
      - homolog_pgdata_replica_2:/var/lib/postgresql
      - homolog_etcd_3:/etcd-data
    networks: !override
      homolog:
        aliases: [etcd_3]
    ports: !override []

  # Replica de BI: sem voto no etcd e sem HAProxy embutido (ETCD_EMBEDDED=false
  # faz o entrypoint dar exec direto no patroni). Fora do depends_on do site.
  # Tags/params entram por env no patch do entrypoint. Cluster existente:
  # patronictl edit-config (max_connections 400, max_slot_wal_keep_size,
  # member_slots_ttl) e rolling restart dos membros atuais.
  db_bi:
    <<: *patroni-node
    container_name: newsdc_homolog_db_bi
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    environment:
      <<: *patroni-environment
      ETCD_EMBEDDED: "false"
      PATRONI_NAME: db_bi
      PATRONI_RESTAPI_CONNECT_ADDRESS: db_bi:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: db_bi:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/pgdata
      PATRONI_TAG_NOFAILOVER: "true"
      PATRONI_TAG_NOLOADBALANCE: "true"
      PATRONI_TAG_NOSYNC: "true"
      PATRONI_TAG_REPLICATEFROM: db_replica_2
      PATRONI_LOCAL_PARAM_hot_standby_feedback: "off"
      PATRONI_LOCAL_PARAM_max_standby_streaming_delay: 300s
      PATRONI_LOCAL_PARAM_work_mem: 64MB
      # Memoria compativel com o teto de 1,5g (homolog na VM de 7,6g).
      PATRONI_MEMORY_SHARED_BUFFERS: 384MB
      PATRONI_MEMORY_EFFECTIVE_CACHE_SIZE: 768MB
      PATRONI_MEMORY_MAINTENANCE_WORK_MEM: 64MB
    volumes: !override
      - homolog_pgdata_bi:/var/lib/postgresql
    networks: !override
      - homolog
    ports: !override []
    depends_on: !reset {}
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8008/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

volumes:
  homolog_pgdata_bi:
  homolog_etcd_1:
  homolog_etcd_2:
  homolog_etcd_3:
