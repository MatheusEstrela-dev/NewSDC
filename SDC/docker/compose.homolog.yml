# ============================================================================
# SDC - HOMOLOGACAO: Caddy balanceando N replicas do app, banco real.
#
# Uso (da pasta SDC/):
#   APP_INSTANCES=2 dotenvx run -f docker/.env -- docker compose -f docker/compose.homolog.yml up -d --scale app=2
#   APP_INSTANCES=6 dotenvx run -f docker/.env -- docker compose -f docker/compose.homolog.yml up -d --scale app=6
#
# Entrada:   http://localhost:8090      (Caddy, balanceando) <- use esta
# Replicas:  http://localhost:8091..8098 (direto, uma por replica, p/ diagnostico)
#            http://localhost:8090/lb-health   responde sem tocar nas replicas
# Postgres:  host:5435     Redis: host:6381
#
# ---------------------------------------------------------------------------
# POR QUE ESTE AMBIENTE EXISTE, E NO QUE ELE DIFERE DO compose.dev.yml
#
# O dev serve para DESENVOLVER: codigo por bind mount, opcache revalidando,
# uma replica so, portas fixas. Nada disso mede capacidade -- o bind mount do
# Windows e o revalidate do opcache cobram um custo por requisicao que
# producao nao paga.
#
# Aqui o objetivo e OUTRO: reproduzir a forma de producao para que um numero
# medido signifique alguma coisa. Por isso:
#
#   - codigo vem da IMAGEM, sem bind mount (igual a producao)
#   - sem o override dev-opcache.ini, entao validate_timestamps=0
#   - cada replica tem a forma da replica on-premise: 1,75 vCPU, 6 workers
#   - o banco tem a forma do banco on-premise: 2 vCPU, 4 GB, onprem.conf
#   - o Caddy entra na frente, como em producao
#
# O QUE ISTO AINDA NAO E: um ensaio de capacidade valido. Os dados aqui tem
# cardinalidade de desenvolvimento, e o Postgres escolhe outros planos com o
# volume real. Serve para medir CUSTO POR REQUISICAO e ORDEM DE SATURACAO, que
# nao dependem disso, e para exercitar o balanceamento de verdade.
# ============================================================================

name: newsdc-homolog

# Variaveis do modulo Ranking, UMA vez so, herdadas por app, queue_ranking e
# scheduler. Precisam vir do compose: o .env vem assado na imagem e nao tem
# nenhuma RANKING_*; sem elas o modulo cai nos defaults de config/ranking.php
# (habilitado=false) e /ranking responde 404, junto com widget e menu.
#
# A ancora nao e so para economizar linhas. O despachante do outbox (no
# scheduler) e o app PRECISAM concordar em RANKING_HABILITADO: o listener do
# ranking so e registrado com o modulo ligado, e se o despachante rodar com ele
# desligado o evento e marcado como despachado sem chegar ao ranking - fato
# perdido. Tres copias do bloco divergiriam cedo ou tarde.
#
# A database do ranking e separada da operacional, no mesmo servidor de
# homolog. RANKING_SOURCE_* e a origem somente leitura.
x-ranking-env: &ranking-env
  RANKING_HABILITADO: "true"
  RANKING_MODO_SOMBRA: "false"
  RANKING_DB_HOST: ${DB_TARGET_HOST:-db}
  RANKING_DB_PORT: ${DB_TARGET_PORT:-5432}
  RANKING_DB_DATABASE: sdc_ranking
  RANKING_DB_USERNAME: ${DB_USERNAME:-sdc}
  RANKING_DB_PASSWORD: ${DB_PASSWORD:-sdc}
  RANKING_DB_SSLMODE: disable
  RANKING_READ_USERNAME: ${DB_USERNAME:-sdc}
  RANKING_READ_PASSWORD: ${DB_PASSWORD:-sdc}
  RANKING_SOURCE_HOST: ${DB_TARGET_HOST:-db}
  RANKING_SOURCE_PORT: ${DB_TARGET_PORT:-5432}
  RANKING_SOURCE_DATABASE: ${DB_DATABASE:-sdc}
  RANKING_SOURCE_USERNAME: ${DB_USERNAME:-sdc}
  RANKING_SOURCE_PASSWORD: ${DB_PASSWORD:-sdc}
  # Resgate: pedidos de DEMONSTRACAO so em homologacao. Em APP_ENV=production
  # o modo e ignorado a forca (ModoDemonstracao), mesmo com esta variavel.
  RESGATE_PERMITIR_DEMONSTRACAO: "true"
  RANKING_SOURCE_SSLMODE: disable

# Conexao de log (pgsql_log), UMA vez so, herdada por app, filas, scheduler e
# reverb. Direto no db e nunca pelo PgBouncer: o pooler so conhece o `sdc` da
# conexao critica, e a sessao de log tem orcamento proprio no guardrail do
# entrypoint (que, com LOG_DB_HOST definido, conta essas sessoes no Postgres).
# So define o destino: o log continua na pgsql ate DB_LOG_CONNECTION=pgsql_log
# ser ligado de proposito (virada por ambiente, ver config/database.php).
x-log-db-env: &log-db-env
  LOG_DB_HOST: ${LOG_DB_TARGET_HOST:-db}
  LOG_DB_PORT: ${LOG_DB_TARGET_PORT:-5432}

# Bancos dedicados (geoespacial e treinamento): mesmo racional do log -- direto
# no db, nunca pelo PgBouncer, UMA vez so para app, filas, scheduler e reverb.
# So define o destino; DB_GEO_CONNECTION / DB_TREINAMENTO_CONNECTION continuam
# desligados ate a virada de proposito.
x-geo-db-env: &geo-db-env
  GEO_DB_HOST: ${GEO_DB_TARGET_HOST:-db}
  GEO_DB_PORT: ${GEO_DB_TARGET_PORT:-5432}

x-treinamento-db-env: &treinamento-db-env
  TREINAMENTO_DB_HOST: ${TREINAMENTO_DB_TARGET_HOST:-db}
  TREINAMENTO_DB_PORT: ${TREINAMENTO_DB_TARGET_PORT:-5432}

# E-mail real pelo SMTP da Prodemge, com credenciais do docker/.env. Ate
# 2026-10-09 o homolog usava MAIL_MAILER=log e o mailer de log escreve em
# nivel debug, abaixo do minimo info dos canais: a redefinicao de senha
# "enviava" e a mensagem sumia. Atencao: o banco do homolog tem e-mails
# reais, entao todo envio daqui chega de verdade ao destinatario.
x-mail-env: &mail-env
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SDC}

# Variaveis do modulo Acessos (integracao com o Active Directory), UMA vez so,
# herdadas por app, queue_diretorio e scheduler. App e worker PRECISAM concordar
# em driver e arquivo: o app semeia o diretorio fake e o worker o consome, pelo
# volume de storage compartilhado. Em homologacao o driver e fake ate a
# validacao em OU/conta de teste (decisao P7); trocar para o AD real e mudar
# estas variaveis, nunca o codigo. A chave de entrega (cifra da senha
# temporaria) vem do docker/.env, nunca do repositorio.
x-diretorio-env: &diretorio-env
  DIRETORIO_DRIVER: fake
  DIRETORIO_SEARCH_BASE: OU=SDC,DC=homolog,DC=local
  DIRETORIO_BASE_DN: DC=homolog,DC=local
  DIRETORIO_CHAVE_ENTREGA: ${DIRETORIO_CHAVE_ENTREGA}
  DIRETORIO_FAKE_ARQUIVO: /var/www/storage/app/diretorio-fake.json

# Caixa de entrada (C1): banco `sdc_entrada` NO CLUSTER do sdc (lider + standby
# sincrono), conexao pgsql_entrada. Herdada por api_integracao,
# queue_integracao e scheduler (este agenda reenfileirar/podar). Sem HA aponta
# ao proprio db; o compose.homolog-ha.yml aponta ao lider pelo HAProxy 6434.
x-entrada-db-env: &entrada-db-env
  ENTRADA_DB_HOST: ${ENTRADA_DB_TARGET_HOST:-db}
  ENTRADA_DB_PORT: ${ENTRADA_DB_TARGET_PORT:-5432}
  ENTRADA_DB_DATABASE: sdc_entrada
  ENTRADA_DB_USERNAME: ${ENTRADA_DB_USERNAME:-${DB_USERNAME:-sdc}}
  ENTRADA_DB_PASSWORD: ${ENTRADA_DB_PASSWORD:-${DB_PASSWORD:-sdc}}

# sdc_powerbi (C1) vive em INSTANCIA PROPRIA, o servico db_powerbi: fora do
# Patroni, sem HA nem standby. E derivado e reconstruivel (bi_* e controle); se
# cair, BI e materializacao param, mas site e caixa de entrada seguem. Membro de
# BI, UMA vez so, herdado por api_integracao, queue_integracao e queue_powerbi.
# O site (app, queue, scheduler...) NAO recebe estas envs nem
# DB_POWERBI_CONNECTION: sem a chave o recurso fica desligado.
#   - POWERBI_DB_*: escrita do sdc_powerbi, no db_powerbi (leitura = mesma
#     instancia, nao ha standby).
#   - FONTE_BI_*: onde o materializador LE o sdc (fonte). Sem HA cai no proprio
#     db (porta 5432); o compose.homolog-ha.yml aponta para o HAProxy 6436, que
#     so atende o db_bi.
#   - POWERBI_PG_MAX_CONNECTIONS: max_connections do db_powerbi (100), base do
#     guardrail de conexoes do sdc_powerbi.
x-powerbi-db-env: &powerbi-db-env
  POWERBI_DB_HOST: ${POWERBI_DB_TARGET_HOST:-db_powerbi}
  POWERBI_DB_PORT: ${POWERBI_DB_TARGET_PORT:-5432}
  POWERBI_DB_DATABASE: sdc_powerbi
  POWERBI_DB_USERNAME: ${POWERBI_DB_USERNAME:-${DB_USERNAME:-sdc}}
  POWERBI_DB_PASSWORD: ${POWERBI_DB_PASSWORD:-${DB_PASSWORD:-sdc}}
  POWERBI_DB_READ_HOST: db_powerbi
  POWERBI_DB_READ_PORT: 5432
  POWERBI_DB_READ_USERNAME: ${POWERBI_DB_READ_USERNAME:-${DB_USERNAME:-sdc}}
  POWERBI_DB_READ_PASSWORD: ${POWERBI_DB_READ_PASSWORD:-${DB_PASSWORD:-sdc}}
  POWERBI_PG_MAX_CONNECTIONS: 100
  FONTE_BI_DB_HOST: ${BI_DB_TARGET_HOST:-db}
  FONTE_BI_DB_PORT: ${BI_DB_TARGET_PORT:-5432}
  FONTE_BI_DB_USERNAME: ${FONTE_BI_DB_USERNAME:-${DB_USERNAME:-sdc}}
  FONTE_BI_DB_PASSWORD: ${FONTE_BI_DB_PASSWORD:-${DB_PASSWORD:-sdc}}
  FONTE_BI_DB_SSLMODE: disable
  # Teto do membro de BI (leitura e fonte nao somam no lider).
  BI_PG_MAX_CONNECTIONS: ${BI_PG_MAX_CONNECTIONS:-200}

services:
  # --------------------------------------------------------------------------
  # Balanceador. Em producao o Swarm distribui pelo VIP do servico; aqui, sem
  # Swarm, quem distribui e o Caddy -- e por isso o Caddyfile de homologacao
  # usa `dynamic a`, que reconsulta o DNS. Ver docker/caddy/Caddyfile.homolog.
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: newsdc_homolog_caddy
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./caddy/Caddyfile.homolog:/etc/caddy/Caddyfile:ro
      # Videos HLS do EAD: o Caddy serve do mesmo volume em que o worker grava.
      - homolog_storage:/srv/storage:ro
    networks:
      - homolog
    depends_on:
      - app
    mem_limit: 256m
    # 1.0, nao 0.5. A medicao de 18/09 mostrou o balanceador a 72% de
    # utilizacao quando o andar de aplicacao estava a 35%: a 0,343 ms/req ele
    # saturaria em ~1.460 req/s, contra ~3.080 do app. Com 0.5 vCPU a unica
    # porta de entrada virava o gargalo antes de tudo que ela protege, e um
    # ensaio de capacidade mediria o teto do proxy achando que media o da
    # aplicacao.
    cpus: 1.0

  # --------------------------------------------------------------------------
  # Aplicacao. SEM container_name e SEM ports: os dois impedem `--scale`.
  #
  # cpus/mem espelham UMA replica do stack.app.onpremise.yml (1,75 vCPU /
  # 2,25 GB), entao `--scale app=2` reproduz a producao de hoje e `--scale
  # app=6` mostra o que 6 entregariam.
  #
  # --------------------------------------------------------------------------
  app:
    image: newsdc-swoole-dev:latest
    build:
      context: ..
      dockerfile: docker/swoole/Dockerfile
      args:
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    restart: unless-stopped
    mem_limit: 2304m
    cpus: 1.75

    # Uma porta por replica, alocada da faixa. O Compose distribui: a primeira
    # replica pega 8091, a segunda 8092, e assim por diante -- e o range e o que
    # permite isso conviver com --scale (uma porta fixa tornaria o servico
    # inescalavel, que foi o motivo de nao haver `ports` aqui antes).
    #
    # NAO e por onde o trafego deve entrar: para isso existe o Caddy na 8090.
    # Serve para o que o balanceador atrapalha:
    #
    #   - bater numa replica especifica para isolar um problema que so ocorre
    #     nela (ver se e a replica ou a aplicacao)
    #   - medir UMA replica sem o custo e a distribuicao do proxy, que e o
    #     numero a comparar com os ~130 req/s por replica do on-premise
    #   - conferir que uma replica subiu antes de o balanceador incluir ela
    ports:
      - "8091-8098:8000"

    # Ancora reaproveitada pelo api_integracao (mesmo ambiente base do app).
    environment: &homolog-app-env
      WORKDIR: /var/www
      APP_NAME: "SDC Homologacao"
      # staging, e nao production, por UM motivo especifico: o middleware
      # ForceHttps redireciona (302) toda requisicao nao-segura quando o
      # ambiente e 'production', e aqui a entrada e HTTP puro na 8090. Com
      # 'production' o balanceador devolveria 302 em vez de exercitar as
      # replicas -- mediria o redirect, nao a aplicacao.
      #
      # Tudo o mais que importa continua igual a producao: APP_DEBUG=false,
      # opcache sem revalidacao, codigo vindo da imagem.
      #
      # Para exercitar TAMBEM o caminho HTTPS (ForceHttps, cookie seguro),
      # troque para production E ponha `tls internal` no Caddyfile.homolog --
      # ai o Caddy emite certificado da CA local dele e o cliente de carga
      # precisa de -k. Custa handshake TLS na medicao, que producao tambem paga.
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY ausente em SDC/docker/.env}
      # O acesso e pelo Caddy na 8090 (8080 e do reverb do dev), e e essa URL que
      # a aplicacao deve gerar nos assets -- nao a porta interna 8000.
      APP_URL: http://localhost:8090

      OCTANE_SERVER: swoole
      OCTANE_HTTPS: "false"
      PORT: 8000
      # Forma da replica on-premise: 6 workers HTTP + 2 task.
      OCTANE_WORKERS: 6
      OCTANE_TASK_WORKERS: 2
      OCTANE_MAX_REQUESTS: 1000
      OCTANE_HOOK_FLAGS_ENABLED: "false"
      DB_PERSISTENT: "false"

      # Classmap ja vem pronto na imagem; regenerar so atrasaria o boot de cada
      # replica sem motivo, porque aqui nao ha codigo entrando por bind mount.
      AUTOLOAD_REFRESH_ON_BOOT: "false"

      # Consumidor de fila dedicado (servico queue abaixo).
      START_EMBEDDED_QUEUE: "false"

      # Guardrail de conexoes.
      #
      # APP_INSTANCES precisa bater com o --scale, e o container nao tem como
      # descobrir a escala sozinho -- por isso vem por variavel, para que os
      # dois numeros sejam passados no MESMO comando:
      #
      #   APP_INSTANCES=4 dotenvx run -f docker/.env -- \
      #     docker compose -f docker/compose.homolog.yml up -d --scale app=4
      #
      # Deixar desatualizado nao quebra nada visivelmente: o gate apenas
      # projeta MENOS conexoes do que serao abertas e aprova um arranjo que
      # nao cabe. A falha aparece depois, como "too many connections" no meio
      # de um request -- que e precisamente o que este guardrail existe para
      # evitar.
      PG_MAX_CONNECTIONS: 100
      APP_INSTANCES: ${APP_INSTANCES:-2}
      # Consumidores externos do lider do sdc (db): 8 (queue, queue_medalhao,
      # queue_ranking, scheduler, reverb e sessoes de log) + 3 queue_integracao
      # (sdc, entrada, log) + 1 queue_powerbi (log; a leitura vai ao membro de
      # BI e o sdc_powerbi ao db_powerbi, fora deste lider) + 10 api_integracao
      # (5 no sdc e 5 no sdc_entrada). O sdc_powerbi saiu da conta: tem
      # instancia propria. Numero ainda a reconferir contra o guardrail.
      EXTERNAL_DB_CONSUMERS: 22
      DB_MAX_CONCURRENT: 60

      # Destino do banco: direto ou pelo pooler. E o A/B que este ambiente
      # existe para permitir -- os dois arranjos, mesma carga, mesmo rig:
      #
      #   direto (padrao):
      #     APP_INSTANCES=4 dotenvx run -f docker/.env -- \
      #       docker compose -f docker/compose.homolog.yml up -d --scale app=4
      #
      #   pelo PgBouncer:
      #     DB_TARGET_HOST=pgbouncer DB_TARGET_PORT=6432 DB_POOLER_MODE=transaction \
      #     APP_INSTANCES=4 dotenvx run -f docker/.env -- \
      #       docker compose -f docker/compose.homolog.yml up -d --scale app=4
      #
      # DB_POOLER_MODE nao e cosmetico: ele muda o comportamento da aplicacao
      # (SetStatementTimeout vira no-op, porque SET de sessao vaza no pool) e a
      # conta do guardrail de conexoes no entrypoint.
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_TARGET_HOST:-db}
      DB_PORT: ${DB_TARGET_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD:-sdc}
      DB_SSLMODE: disable

      # Ranking: ver a ancora x-ranking-env no topo do arquivo.
      <<: [*ranking-env, *diretorio-env, *mail-env, *log-db-env, *geo-db-env, *treinamento-db-env]
      DB_POOLER_MODE: ${DB_POOLER_MODE:-}

      # Lidos pelo guardrail do entrypoint quando DB_POOLER_MODE esta setado.
      # Precisam espelhar o que o servico pgbouncer abaixo realmente usa, senao
      # o gate projeta um orcamento que nao corresponde ao pooler que subiu.
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 25
      PGBOUNCER_MAX_PREPARED_STATEMENTS: 200

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SCHEME: tcp
      REDIS_PREFIX: sdc_homolog_
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "false"

      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
      REVERB_APP_ID: ${REVERB_APP_ID:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http

      # Assistente de IA (core/IA). O .env assado na imagem nao traz a chave,
      # entao ela vem do docker/.env, como as demais credenciais. Vazia, o chat
      # responde "assistente nao configurado" em vez de falhar.
      AI_DRIVER: ${AI_DRIVER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}

      # Ensaio de capacidade: quando preenchido, requisicao com o mesmo valor em
      # X-Loadtest-Bypass fica sem limite de taxa. Sem isso, medir o teto real a
      # partir de uma unica fonte e impossivel -- o gerador esbarra no limite
      # por IP muito antes de o servidor saturar, e o ensaio acaba medindo o
      # rate limiter. Vazio por padrao, e NAO deve ser definido em producao.
      LOADTEST_BYPASS_TOKEN: ${LOADTEST_BYPASS_TOKEN:-}

    volumes:
      # So o que precisa de estado compartilhado entre replicas. Codigo, nao:
      # ele vem da imagem, como em producao.
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs

      # O entrypoint NAO entra por mount. Ele ja entrou, enquanto o
      # `bun install --frozen-lockfile` do Dockerfile falhava e nenhuma imagem
      # podia ser reconstruida -- era o unico jeito de alterar o boot.
      #
      # Aquilo foi resolvido (faltava @fullcalendar/timegrid no bun.lock), entao
      # o mount virou so divergencia: com ele, o rig nunca pegaria um erro de
      # "entrypoint nao foi copiado para a imagem", que e exatamente o tipo de
      # falha que producao teria. Ambiente de homologacao que diverge no boot
      # nao homologa o boot.

    networks:
      - homolog

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck: &homolog-app-healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # O boot do Octane leva ~3min; sem esta folga o Docker mata a replica
      # antes de ela terminar de subir e o --scale nunca estabiliza.
      start_period: 240s

  # --------------------------------------------------------------------------
  # Consumidor de fila. Um so, como no on-premise (la sao 10 processos de
  # supervisor dentro de 1 vCPU). Aqui o mesmo teto, para que a fila sature no
  # mesmo ponto que saturaria em producao.
  # --------------------------------------------------------------------------
  queue:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_homolog_queue
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1
    command:
      - "sh"
      - "-c"
      # notificacoes_urgente ANTES de notificacoes: a ordem da lista e a
      # prioridade. Ela estava fora do consumo e alerta urgente ficava parado
      # no Redis para sempre, sem erro e sem aviso -- producao consome
      # (isolated-workers.conf:38), homologacao nao consumia.
      #
      # medalhao NAO entra aqui: ela tem worker proprio abaixo, como em
      # producao (medalhao-worker.conf). Junta-la a esta lista criaria inversao
      # de prioridade -- um job de coleta externa lento seguraria o worker por
      # ate 120s enquanto alerta urgente espera.
      - "php artisan queue:work redis --queue=critical,high,notificacoes_urgente,auditoria,webhooks,notificacoes,default,low --sleep=1 --tries=3 --max-time=3600 --timeout=120"
    # Ancora reaproveitada por queue_ranking e scheduler: mesmo ambiente base de
    # worker, sem terceira e quarta copia deste bloco.
    environment: &homolog-worker-env
      APP_NAME: "SDC Homologacao Queue"
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY ausente em SDC/docker/.env}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD:-sdc}
      DB_SSLMODE: disable
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PREFIX: sdc_homolog_
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
      # O worker PRECISA das credenciais do Reverb, nao so o app: quando
      # BROADCAST_CONNECTION=reverb, o BroadcastManager e construido no boot de
      # qualquer processo Laravel, inclusive `queue:work`. Sem APP_KEY o Pusher
      # recebe auth_key nulo e o container morre em loop no boot.
      #
      # O buraco existia desde o inicio e so apareceu agora: a imagem anterior
      # era de 28/08 e o codigo daquela epoca nao montava o broadcaster no boot
      # de console. Nao e regressao do rebuild -- e um defeito que o rebuild
      # revelou.
      REVERB_APP_ID: ${REVERB_APP_ID:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      <<: [*mail-env, *log-db-env, *geo-db-env, *treinamento-db-env]

    # A imagem traz um HEALTHCHECK que bate em localhost:8000/health -- correto
    # para o app, errado aqui: este container nao serve HTTP. Sem sobrescrever,
    # ele fica 'unhealthy' para sempre estando perfeitamente vivo, e um estado
    # falso e pior que nenhum: ninguem confia no painel depois.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Worker DEDICADO da fila medalhao, espelhando producao
  # (docker/supervisor/medalhao-worker.conf).
  #
  # Por que separado e nao mais um item na lista do worker principal: os jobs
  # de medalhao sao coletas em APIs externas (INMET, CEMADEN, sismos,
  # geoespacial) e podem ficar presos ate o timeout. No worker unico isso
  # seguraria alerta urgente atras de uma requisicao HTTP lenta de terceiro --
  # inversao de prioridade com consequencia operacional real.
  #
  # Ate agora homologacao nao consumia esta fila de forma alguma: os 7
  # despachos onQueue('medalhao') do codigo entravam no Redis e ficavam la.
  # --------------------------------------------------------------------------
  queue_medalhao:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_homolog_queue_medalhao
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command:
      - "sh"
      - "-c"
      # timeout maior que o do worker principal: coleta externa e lenta por
      # natureza, e matar em 120s produziria retentativa em vez de resultado.
      - "php artisan queue:work redis --queue=medalhao --sleep=3 --tries=2 --max-time=3600 --timeout=300"
    environment:
      APP_NAME: "SDC Homologacao Queue"
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY ausente em SDC/docker/.env}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD:-sdc}
      DB_SSLMODE: disable
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PREFIX: sdc_homolog_
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
      # O worker PRECISA das credenciais do Reverb, nao so o app: quando
      # BROADCAST_CONNECTION=reverb, o BroadcastManager e construido no boot de
      # qualquer processo Laravel, inclusive `queue:work`. Sem APP_KEY o Pusher
      # recebe auth_key nulo e o container morre em loop no boot.
      #
      # O buraco existia desde o inicio e so apareceu agora: a imagem anterior
      # era de 28/08 e o codigo daquela epoca nao montava o broadcaster no boot
      # de console. Nao e regressao do rebuild -- e um defeito que o rebuild
      # revelou.
      REVERB_APP_ID: ${REVERB_APP_ID:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      <<: [*mail-env, *log-db-env, *geo-db-env, *treinamento-db-env]
      # Sem o token, config/medalhao.php:53 fica nulo e o InmetApiClient falha
      # em toda coleta. E o unico servico do homolog que precisa dele -- o app
      # nao chama a API do INMET, quem chama sao os jobs desta fila.
      MEDALHAO_INMET_TOKEN: ${MEDALHAO_INMET_TOKEN:-}

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Worker do ranking. Espelha docker/supervisor/ranking-worker.conf de
  # producao: conexao propria (redis-ranking) para que pontuacao nunca dispute
  # worker com alerta urgente - o mesmo motivo do queue_medalhao ter servico
  # proprio. O queue acima consome so a conexao `redis` e nunca pegaria estes
  # jobs.
  #
  # Um processo e limites baixos bastam: cada job sao poucas escritas na base
  # do ranking, e o volume e o de marcos de negocio, nao o de requisicoes.
  # retry_after da conexao (180s) e maior que o --timeout (120s), como manda a
  # regra de config/queue.php.
  # --------------------------------------------------------------------------
  queue_ranking:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_homolog_queue_ranking
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    command:
      - "sh"
      - "-c"
      - "php artisan queue:work redis-ranking --sleep=3 --tries=3 --max-time=3600 --timeout=120"
    environment:
      <<: [*homolog-worker-env, *ranking-env]
      APP_NAME: "SDC Homologacao Queue Ranking"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Worker de transcodificacao de video (FFmpeg) do Treinamento EAD. Espelha o
  # servico queue-videos de producao: mesma imagem de queue (Dockerfile.queue,
  # com ffmpeg), perfil videos do supervisor (so videos-worker.conf) e fila
  # propria, para que a transcodificacao nunca dispute CPU nem worker com a
  # notificacao. O supervisor sobe o `queue:work redis-videos`.
  # --------------------------------------------------------------------------
  queue_videos:
    build:
      context: ..
      dockerfile: docker/Dockerfile.queue
    image: newsdc-queue-dev:latest
    container_name: newsdc_homolog_queue_videos
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
    stop_grace_period: 16m
    environment:
      <<: *homolog-worker-env
      APP_NAME: "SDC Homologacao Queue Videos"
      SUPERVISOR_PROFILE: videos
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # API de integracao: mesma imagem e mesmo codigo do app, processo separado.
  # Atende so o que o Caddy desvia (matcher @api_integracao no Caddyfile) e
  # assim a carga externa (BI, RAT protocolos, TDAP...) nao disputa worker com
  # o site. Sem ports: a entrada e so pelo Caddy. Sem --scale (uma instancia, o
  # guardrail conta APP_INSTANCES=1). Nao usa replicas do site: DB_READ_ENABLED
  # false. A conexao do sdc_powerbi liga so aqui (DB_POWERBI_CONNECTION).
  # Rollback: tirar o matcher do Caddy e parar este servico.
  # --------------------------------------------------------------------------
  api_integracao:
    image: newsdc-swoole-dev:latest
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      <<: [*homolog-app-env, *powerbi-db-env, *entrada-db-env]
      APP_NAME: "SDC Homologacao API Integracao"
      OCTANE_WORKERS: 4
      OCTANE_TASK_WORKERS: 1
      START_EMBEDDED_QUEUE: "false"
      APP_INSTANCES: 1
      DB_READ_ENABLED: "false"
      DB_POWERBI_CONNECTION: pgsql_powerbi
      DB_ENTRADA_CONNECTION: pgsql_entrada
      # Os demais consumidores do lider: 16 do site (2 replicas x 8) + 8 dos
      # workers do site + 3 queue_integracao + 1 queue_powerbi (so o log) = 28.
      EXTERNAL_DB_CONSUMERS: ${API_INTEGRACAO_EXTERNAL_DB_CONSUMERS:-28}
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    # SEM depends_on db_powerbi: se o BI cair, a entrada nao cai junto.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *homolog-app-healthcheck

  # --------------------------------------------------------------------------
  # Consumidor da entrada assincrona (AplicarEntradaJob). Conexao redis-integracao
  # (retry_after 150 > --timeout 120). Escreve no sdc e no sdc_entrada (ambos no
  # lider) e no sdc_powerbi (db_powerbi). NAO depende do db_powerbi no
  # depends_on: a entrada segue com o BI fora.
  # --------------------------------------------------------------------------
  queue_integracao:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_homolog_queue_integracao
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    command:
      - "sh"
      - "-c"
      - "php artisan queue:work redis-integracao --queue=integracao --sleep=1 --tries=6 --max-time=3600 --timeout=120"
    environment:
      <<: [*homolog-worker-env, *powerbi-db-env, *entrada-db-env]
      APP_NAME: "SDC Homologacao Queue Integracao"
      DB_POWERBI_CONNECTION: pgsql_powerbi
      DB_ENTRADA_CONNECTION: pgsql_entrada
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Materializador do sdc_powerbi (powerbi:materializar). A conexao default
  # pgsql aponta para o MEMBRO DE BI, somente leitura: o worker le o sdc ali
  # (DB_HOST/DB_PORT = BI_DB_TARGET_*; no HA, 6436) e grava o sdc_powerbi no
  # db_powerbi pela pgsql_powerbi. POWERBI_FONTE_EXIGE_STANDBY=true faz o boot falhar
  # se o destino nao for standby (pg_is_in_recovery); so o HA liga (sem HA
  # o db e o proprio lider). failed_jobs e log vao ao
  # lider por DB_LOG_CONNECTION=pgsql_log (LOG_DB_HOST herdado, apontando ao
  # lider), pois a conexao default nao aceita escrita.
  # --------------------------------------------------------------------------
  queue_powerbi:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_homolog_queue_powerbi
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command:
      - "sh"
      - "-c"
      - "php artisan queue:work redis-powerbi --queue=powerbi --sleep=3 --tries=3 --max-time=3600 --timeout=900"
    environment:
      <<: [*homolog-worker-env, *powerbi-db-env]
      APP_NAME: "SDC Homologacao Queue PowerBI"
      DB_HOST: ${BI_DB_TARGET_HOST:-db}
      DB_PORT: ${BI_DB_TARGET_PORT:-5432}
      DB_USERNAME: ${FONTE_BI_DB_USERNAME:-${DB_USERNAME:-sdc}}
      DB_PASSWORD: ${FONTE_BI_DB_PASSWORD:-${DB_PASSWORD:-sdc}}
      DB_READ_ENABLED: "false"
      DB_POWERBI_CONNECTION: pgsql_powerbi
      DB_LOG_CONNECTION: pgsql_log
      POWERBI_FONTE_EXIGE_STANDBY: ${POWERBI_FONTE_EXIGE_STANDBY:-false}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
      db_powerbi:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Worker da fila do diretorio (Acessos/AD). Conexao `diretorio`: driver
  # database no Postgres compartilhado (tabela acessos_fila_diretorio), com
  # backoff proprio. Isolado dos demais workers: uma chamada lenta ao AD nao
  # pode segurar notificacao nem auditoria. Um processo basta: o volume e o de
  # acoes explicitas de um operador (reset, criar, habilitar). O command
  # sobrescreve o /start.sh; --timeout (60s) fica abaixo do retry_after da
  # conexao, como manda a regra de config/queue.php.
  # --------------------------------------------------------------------------
  queue_diretorio:
    image: newsdc-swoole-dev:latest
    # Opt-in ate a conexao `diretorio` existir (Task 5) e a imagem ter ext-ldap.
    profiles: ["diretorio"]
    container_name: newsdc_homolog_queue_diretorio
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    command:
      - "sh"
      - "-c"
      - "php artisan queue:work diretorio --queue=diretorio --sleep=3 --tries=3 --timeout=60 --max-time=3600 --max-jobs=500"
    environment:
      <<: [*homolog-worker-env, *diretorio-env]
      APP_NAME: "SDC Homologacao Queue Diretorio"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: "null"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work diretorio' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Scheduler. Homolog nao tinha nenhum: ranking:materializar-periodos,
  # ranking:reconcile e ranking:snapshot nunca rodavam, e o despacho do outbox
  # nao existia em ambiente nenhum. E a peca que faz o placar se atualizar
  # sozinho - sem ela a "Atualizacao do saldo" congela na ultima projecao.
  #
  # schedule:work e um processo so, e o despacho do outbox e agendado a cada
  # 30s com --once em vez de um loop residente a mais. O plano admite ate 60s
  # de atraso no placar; ganhar 29s nao compensa mais um processo disputando
  # memoria com as replicas.
  #
  # OUTBOX_AGENDAR_DESPACHO so aqui: e o scheduler que le routes/console.php, e
  # ligar o despacho em outro ambiente e decisao dele (config/outbox.php).
  # --------------------------------------------------------------------------
  scheduler:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_homolog_scheduler
    restart: unless-stopped
    # 512m e nao 256m: medido em homolog, o schedule:work parado ocupa ~143 MB
    # e CADA tarefa agendada sobe um Laravel filho de 80 a 110 MB. Na hora
    # cheia o despacho do outbox coincide com o ranking:reconcile, e com 256m o
    # kernel matou o despacho com SIGKILL (OOMKilled=true, 24/09 09:00:02).
    # Dois filhos simultaneos ficam em ~335 MB; o snapshot foi deslocado para
    # nao virar o terceiro. Mesmo teto do queue_medalhao.
    mem_limit: 512m
    cpus: 0.25
    command:
      - "sh"
      - "-c"
      - "php artisan schedule:work"
    environment:
      <<: [*homolog-worker-env, *ranking-env, *diretorio-env, *powerbi-db-env, *entrada-db-env]
      APP_NAME: "SDC Homologacao Scheduler"
      OUTBOX_AGENDAR_DESPACHO: "true"
      # Sem a chave o PowerBiServiceProvider nao agenda materializar,
      # reconciliar nem publicar-arquivos: o BI ficaria parado.
      DB_POWERBI_CONNECTION: pgsql_powerbi
      # Agenda reenfileirar/podar da caixa de entrada (sdc_entrada).
      DB_ENTRADA_CONNECTION: pgsql_entrada
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - homolog_storage:/var/www/storage/app
      - homolog_logs:/var/www/storage/logs
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Banco. Mesma forma do stack.data.onpremise.yml: 2 vCPU, 4 GB, e o MESMO
  # arquivo de configuracao -- inclusive o statement_timeout de 120s. Medir
  # contra um Postgres com outros parametros nao diria nada sobre producao.
  # --------------------------------------------------------------------------
  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: newsdc_homolog_db
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sdc}
      POSTGRES_USER: ${DB_USERNAME:-sdc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sdc}
    volumes:
      - ./postgres/onprem.conf:/etc/postgresql/postgresql.conf:ro
      # PG 18 mudou o layout: o mount vai na RAIZ e a imagem coloca o cluster
      # num subdiretorio. Montar em /data (layout do 16) faz o container entrar
      # em loop de restart reclamando de incompatibilidade de versao. O
      # compose.dev.yml ja usa este formato -- e ele roda a mesma 18.
      - homolog_pgdata:/var/lib/postgresql
      # Cria a role de replicacao e libera o pg_hba para os standbys. So roda
      # na inicializacao de um cluster novo -- num volume que ja existe, os
      # mesmos passos precisam ser aplicados a mao.
      - ./postgres/initdb-replicacao.sh:/docker-entrypoint-initdb.d/10-replicacao.sh:ro
    ports:
      - "5435:5432"
    networks:
      - homolog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sdc} -d ${DB_DATABASE:-sdc}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # sdc_powerbi (C1): instancia Postgres PROPRIA, fora do Patroni, sem HA nem
  # standby. Guarda bi_* e controle da materializacao: dado derivado e
  # reconstruivel a partir do sdc. Se cair, BI e materializacao param; site e
  # caixa de entrada seguem (nada alem do queue_powerbi depende dela).
  #
  # synchronous_commit=off: o dado e o cursor da materializacao gravam na MESMA
  # transacao, entao uma perda de commits recentes so obriga rematerializar,
  # nunca deixa dado e cursor inconsistentes. fsync segue ligado (o cluster nao
  # corrompe). Reaproveita a imagem postgis/postgis:18-3.6-alpine do db. Sem
  # onprem.conf: instancia pequena, parametros inline.
  # --------------------------------------------------------------------------
  db_powerbi:
    image: postgis/postgis:18-3.6-alpine
    container_name: newsdc_homolog_db_powerbi
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=192MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "statement_timeout=120s"
      - "-c"
      - "idle_in_transaction_session_timeout=600s"
      - "-c"
      - "max_wal_size=1GB"
      - "-c"
      - "wal_compression=on"
    environment:
      POSTGRES_DB: sdc_powerbi
      POSTGRES_USER: ${POWERBI_DB_USERNAME:-${DB_USERNAME:-sdc}}
      POSTGRES_PASSWORD: ${POWERBI_DB_PASSWORD:-${DB_PASSWORD:-sdc}}
    volumes:
      # PG 18: mount na RAIZ (mesmo motivo do db).
      - homolog_pgdata_powerbi:/var/lib/postgresql
    ports:
      # 5435 ja e do db; 5439 so para acesso administrativo local.
      - "127.0.0.1:5439:5432"
    networks:
      - homolog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POWERBI_DB_USERNAME:-${DB_USERNAME:-sdc}} -d sdc_powerbi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # STANDBYS DE LEITURA (streaming replication).
  #
  # Topologia: 1 primario que aceita escrita + 2 standbys somente leitura. O
  # banco desta aplicacao e 95,38% leitura (medido em pg_stat_database), entao
  # e a forma que a carga pede.
  #
  # O QUE ELES RESOLVEM
  #   - descarregam leitura do primario, que hoje satura em ~300 req/s
  #   - cada um e um standby quente: o Postgres deixa de ser ponto unico de
  #     falha, e essa razao sozinha ja justifica a replicacao
  #
  # O QUE ELES CUSTAM, E E PRECISO DECIDIR ANTES DE USAR
  #   Replicacao e ASSINCRONA. Quem escreve e le em seguida pode nao ver o que
  #   acabou de gravar. Para um sistema de Defesa Civil isso nao e detalhe:
  #   registrar uma ocorrencia e nao ve-la na tela seguinte e falha de uso.
  #
  #   Por isso o caminho seguro e adotar em duas etapas -- primeiro como
  #   standby de HA (ninguem le deles, risco zero), e so depois rotear leitura,
  #   e apenas de rotas comprovadamente tolerantes a atraso: export Power BI,
  #   dashboards ja cacheados, relatorios. NUNCA o inbox de notificacoes nem
  #   qualquer leitura logo apos escrita.
  #
  # Recursos menores que o primario de proposito: standby so aplica WAL e serve
  # leitura, nao carrega escrita nem autovacuum pesado.
  # --------------------------------------------------------------------------
  db_replica_1: &db-standby
    image: postgis/postgis:18-3.6-alpine
    container_name: newsdc_homolog_db_replica_1
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    user: postgres
    entrypoint: ["bash", "/standby-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/pgdata
      PRIMARY_HOST: db
      PRIMARY_PORT: 5432
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      SLOT_NAME: standby_1
      POSTGRES_USER: ${DB_USERNAME:-sdc}
    volumes:
      - ./postgres/standby-entrypoint.sh:/standby-entrypoint.sh:ro
      - homolog_pgdata_replica_1:/var/lib/postgresql
    ports:
      - "5436:5432"
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # pg_isready sozinho nao distingue standby de primario; a consulta
      # confirma que este cluster esta MESMO em recuperacao, que e o estado
      # de um standby saudavel.
      # -U com o superusuario do cluster: aqui e 'sdc' (POSTGRES_USER do
      # primario), nao 'postgres'. O standby e copia fisica do primario, entao
      # herda os MESMOS papeis -- 'postgres' nao existe e o healthcheck falharia
      # para sempre num standby que esta perfeitamente saudavel.
      test: ["CMD-SHELL", "psql -U ${DB_USERNAME:-sdc} -d postgres -tAc 'SELECT pg_is_in_recovery()' | grep -q t"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  db_replica_2:
    <<: *db-standby
    container_name: newsdc_homolog_db_replica_2
    environment:
      PGDATA: /var/lib/postgresql/pgdata
      PRIMARY_HOST: db
      PRIMARY_PORT: 5432
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
      SLOT_NAME: standby_2
      POSTGRES_USER: ${DB_USERNAME:-sdc}
    volumes:
      - ./postgres/standby-entrypoint.sh:/standby-entrypoint.sh:ro
      - homolog_pgdata_replica_2:/var/lib/postgresql
    ports:
      - "5437:5432"

  # --------------------------------------------------------------------------
  # PgBouncer. Sobe sempre, mas so e USADO quando DB_TARGET_HOST=pgbouncer --
  # assim da para medir com e sem, no mesmo ambiente, sem reconstruir nada.
  #
  # O QUE ELE RESOLVE: sem pooler, worker e conexao de banco sao a mesma coisa,
  # entao 22 replicas x 6 workers = 132 conexoes contra um max_connections de
  # 100. Com pooler, as replicas abrem contra ELE (sockets baratos) e ele mantem
  # um punhado de conexoes reais contra o Postgres.
  #
  # O QUE ELE NAO RESOLVE: CPU do banco. O teto de ~300 req/s do Postgres de
  # 2 vCPU continua onde estava -- o pooler desacopla conexao, nao cria
  # processamento.
  # --------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: newsdc_homolog_pgbouncer
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD:-sdc}
      DB_NAME: ${DB_DATABASE:-sdc}

      # transaction mode e o que desacopla worker de conexao: a conexao de
      # servidor volta ao pool no fim de CADA transacao, nao no fim da sessao.
      # E tambem o que quebra prepared statement de servidor -- ver abaixo.
      POOL_MODE: transaction
      LISTEN_PORT: 6432

      # Cliente ocioso e barato (um socket), conexao de servidor e cara (um
      # processo no Postgres). Dai a assimetria entre os dois numeros.
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25

      # PgBouncer 1.21+ rastreia os PREPARE e os refaz na conexao nova. E o que
      # permite manter PDO::ATTR_EMULATE_PREPARES=false (prepares do servidor)
      # sem tomar 'prepared statement does not exist' sob carga. A imagem traz
      # 1.25.2, entao esta coberto.
      MAX_PREPARED_STATEMENTS: 200

      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${DB_USERNAME:-sdc}
    ports:
      # Exposta para inspecao: `psql -h localhost -p 6433 -U sdc pgbouncer`
      # e depois SHOW POOLS / SHOW STATS mostram o pool ao vivo.
      - "6433:6432"
    networks:
      - homolog
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${DB_USERNAME:-sdc} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: newsdc_homolog_redis
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 0.5
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6381:6379"
    networks:
      - homolog
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  reverb:
    image: newsdc-swoole-dev:latest
    container_name: newsdc_homolog_reverb
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      APP_NAME: "SDC Homologacao Reverb"
      APP_ENV: staging
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY ausente em SDC/docker/.env}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-null}
      REVERB_APP_ID: ${REVERB_APP_ID:-}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      <<: [*log-db-env, *geo-db-env, *treinamento-db-env]
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PREFIX: sdc_homolog_
      CACHE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD:-sdc}
      DB_SSLMODE: disable
    networks:
      - homolog
    depends_on:
      redis:
        condition: service_healthy

    # A imagem traz um HEALTHCHECK que bate em localhost:8000/health -- correto
    # para o app, errado aqui: este container nao serve HTTP. Sem sobrescrever,
    # ele fica 'unhealthy' para sempre estando perfeitamente vivo, e um estado
    # falso e pior que nenhum: ninguem confia no painel depois.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'reverb:start' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  homolog:
    driver: bridge

volumes:
  homolog_pgdata:
  homolog_pgdata_powerbi:
  homolog_pgdata_replica_1:
  homolog_pgdata_replica_2:
  homolog_storage:
  homolog_logs:
