; Override de DESENVOLVIMENTO do opcache. Carrega depois do 99-opcache.ini da
; imagem, porque conf.d e lido em ordem alfabetica e "zz" vem depois de "99".
;
; A imagem fixa opcache.validate_timestamps=0, que e a configuracao correta em
; producao: o PHP nunca reconfere mtime, e workers persistentes servem bytecode
; da memoria compartilhada sem tocar o disco.
;
; Em desenvolvimento isso e armadilha. Com o codigo montado por bind do host,
; editar um arquivo NAO tem efeito nenhum: os workers seguem executando a versao
; compilada. E `octane:reload` nao resolve, porque ele re-forka os workers e a
; memoria compartilhada do opcache sobrevive ao fork -- so derrubar o processo
; mestre limpa.
;
; O sintoma e traicoeiro: `composer dump-autoload` reescreve o
; autoload_classmap.php, o CLI passa a enxergar a classe nova (SAPI diferente,
; opcache proprio), e o navegador continua com
; "Target class [...] does not exist". Aconteceu tres vezes num unico dia,
; custando dois restarts de seis minutos, ate a causa aparecer.
;
; validate_timestamps=1 com revalidate_freq=0 faz o PHP conferir o mtime a cada
; requisicao. Custa um stat por arquivo incluido -- irrelevante em dev, e o
; preco de o codigo editado valer imediatamente.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
