# ============================================================================
# PostgreSQL 18 - tuning de PRODUCAO (Dell R760)
# Calibrado para o container `db`: limite 24 GB RAM / 6 vCPU, storage NVMe (PLP).
# Se mudar o limite de memoria do container, reajuste shared_buffers e
# effective_cache_size proporcionalmente (regra: 25% e ~75% da RAM do container).
# ============================================================================

# --- Conexoes -------------------------------------------------------------
# Octane reusa o pool PDO entre requests; nao precisa de centenas de conexoes.
# 10 workers + 4 task + 4 queue workers + folga.
listen_addresses = '*'
max_connections = 80

# --- Memoria --------------------------------------------------------------
shared_buffers = 6GB                 # ~25% dos 24GB do container
effective_cache_size = 18GB          # ~75% (estimativa de cache do SO + PG)
maintenance_work_mem = 1GB           # VACUUM, CREATE INDEX, indices GiST do PostGIS
work_mem = 32MB                      # por operacao de sort/hash; *cuidado* com max_connections
huge_pages = try

# --- WAL / Durabilidade ---------------------------------------------------
wal_level = replica                  # permite habilitar replica/backup fisico depois
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = on
synchronous_commit = on              # dado critico: nao relaxar sem PLP garantido

# --- Planner (NVMe) -------------------------------------------------------
random_page_cost = 1.1               # NVMe: leitura aleatoria ~ sequencial
effective_io_concurrency = 200       # NVMe aguenta muitas I/Os concorrentes
default_statistics_target = 100

# --- Paralelismo ----------------------------------------------------------
max_worker_processes = 6             # = vCPU do container
max_parallel_workers = 6
max_parallel_workers_per_gather = 3
max_parallel_maintenance_workers = 3

# --- Autovacuum (workload geo/transacional ativa) -------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025

# --- Observabilidade (pg_stat_statements + pg_exporter) -------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_activity_query_size = 2048
track_io_timing = on

# --- Logs (lentas + diagnostico) ------------------------------------------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 1000    # loga query > 1s
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%t [%p] %u@%d '

# --- Timezone -------------------------------------------------------------
timezone = 'America/Sao_Paulo'
