# ============================================================================
# PostgreSQL 18 - tuning ON-PREMISE (VM 8 vCores / 16 GB compartilhada)
# Calibrado para o servico `db` da stack sdc-data (stack.data.onpremise.yml): limite 4 GB RAM /
# 2 vCPU, app+queue+redis+reverb dividem a MESMA VM. Se mudar o limite de
# memoria do container, reajuste shared_buffers (~25%) e effective_cache_size
# (~75%) proporcionalmente.
# ============================================================================

# --- Conexoes -------------------------------------------------------------
# Octane reusa a conexao PDO entre requests (hooks off = 1 por worker).
# 12 workers + 4 task + queue dedicado (4+scheduler) + folga.
listen_addresses = '*'
max_connections = 100

# --- Memoria --------------------------------------------------------------
shared_buffers = 1GB                 # ~25% dos 4GB do container
effective_cache_size = 3GB           # ~75% (inclui page cache do SO que sobra na VM)
maintenance_work_mem = 256MB         # VACUUM, CREATE INDEX
work_mem = 16MB                      # por operacao de sort/hash; teto seguro p/ 100 conexoes

# --- WAL / Durabilidade ---------------------------------------------------
wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_compression = on
synchronous_commit = on              # dado critico: nao relaxar sem storage com PLP

# --- Planner (SSD) ----------------------------------------------------------
random_page_cost = 1.1

# --- Paralelismo -----------------------------------------------------------
# 2 vCPU de teto: paralelismo de query agressivo rouba CPU do proprio Postgres.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1

# --- Autovacuum / Logs ------------------------------------------------------
autovacuum_vacuum_cost_limit = 400
# Teto de ultima instancia para consulta que nao termina.
#
# Hoje a unica protecao e o middleware SetStatementTimeout, que faz SET por
# rota (10s). Ele vira NO-OP assim que DB_POOLER_MODE=transaction for ligado --
# SET de sessao vaza entre transacoes no pool -- e o proprio codigo diz que
# passa a "confiar no statement_timeout default do servidor". Este default nao
# existia: ligar o pooler removeria a protecao sem por nada no lugar, e uma
# consulta ruim seguraria uma conexao do pool indefinidamente.
#
# 120s e generoso DE PROPOSITO, e nao os 10s do middleware: este valor vale para
# TODA sessao, inclusive migrations e os jobs da fila medalhao (timeout de 900s,
# com rollup que varre a serie inteira). Um teto agressivo aqui quebraria o ETL
# de madrugada. O papel deste numero e matar o que travou, nao apertar o caminho
# quente -- esse aperto continua sendo do middleware, por rota.
#
# Quando houver separacao de roles, o certo e ALTER ROLE por perfil:
#   ALTER ROLE sdc_app SET statement_timeout = '10s';
#   ALTER ROLE sdc_etl SET statement_timeout = '0';
# Ai o limite sobrevive ao pooler, que agrupa por (usuario, banco).
statement_timeout = 120s

# Transacao aberta e ociosa segura conexao E bloqueia VACUUM. Sob pooler o
# estrago e maior: a conexao fica presa no pool, indisponivel para todos.
idle_in_transaction_session_timeout = 60s

log_min_duration_statement = 1000    # loga queries > 1s (diagnostico de lentidao)
log_line_prefix = '%m [%p] %u@%d '
