# ============================================================================
# SDC - Docker Compose PRODUCAO (Dell R760 on-premise)
# Arquitetura ESSENCIAL: Octane/Swoole + PostgreSQL/PostGIS + Redis + Queue
# ----------------------------------------------------------------------------
# Sizing: projetado para OCTANE_WORKERS=10 (+ 4 task workers).
# O queue roda via Supervisor e ja inclui o scheduler (laravel-scheduler).
#
# Uso:  cd docker && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================================================

name: sdc-prod

# ----------------------------------------------------------------------------
# Bloco reaproveitado: build da imagem da aplicacao (Swoole). app e queue
# compartilham o MESMO codigo; queue tem Dockerfile proprio (Supervisor).
# ----------------------------------------------------------------------------
x-app-build: &app-build
  context: ..
  dockerfile: docker/swoole/Dockerfile

services:
  # ==========================================================================
  # APP - Laravel Octane sobre Swoole (10 workers + 4 task workers)
  # ==========================================================================
  app:
    build: *app-build
    image: sdc/app:${VERSION:-latest}
    restart: always
    hostname: app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_NAME: ${APP_NAME:-SDC - Sistema de Defesa Civil}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      # Octane / Swoole
      OCTANE_SERVER: swoole
      OCTANE_HTTPS: "true"
      OCTANE_WORKERS: "10"
      OCTANE_TASK_WORKERS: "4"
      OCTANE_MAX_REQUESTS: "500"
      PORT: "8000"

      # Banco (PostgreSQL/PostGIS local). DB_PERSISTENT=false e OBRIGATORIO
      # sob SWOOLE_HOOK_ALL (PDO persistente compartilhado entre coroutines quebra).
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      DB_PERSISTENT: "false"

      # Redis (rede interna, sem TLS). REDIS_PREFIX EXPLICITO e identico ao do
      # queue: sem ele, APP_NAME divergente isola keyspaces e dessincroniza app/worker.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_SCHEME: tcp
      REDIS_PREFIX: ${REDIS_PREFIX:-sdc_prod_}
      CACHE_PREFIX: ${CACHE_PREFIX:-sdc_prod_cache_}

      # Hooks Swoole OFF (1 request por worker): phpredis nao e compartilhado
      # entre coroutines -> Redis seguro e coerente no scale-out (file cache nao
      # e). Sessao em cookie (stateless). Queue permanece em Redis.
      CACHE_DRIVER: redis
      SESSION_DRIVER: cookie
      QUEUE_CONNECTION: redis

      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      # Anexos/exports persistentes (FS do container e efemero)
      - app_storage:/var/www/storage/app
      - ./logs/app:/var/www/storage/logs

    networks:
      - sdc_internal
      - sdc_edge

    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 1G

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ==========================================================================
  # QUEUE - Workers + Scheduler (Supervisor: numprocs=4 + laravel-scheduler)
  # ==========================================================================
  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile.queue
    image: sdc/queue:${VERSION:-latest}
    restart: always
    hostname: queue

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-sdc}
      DB_USERNAME: ${DB_USERNAME:-sdc}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_PREFIX: ${REDIS_PREFIX:-sdc_prod_}
      CACHE_PREFIX: ${CACHE_PREFIX:-sdc_prod_cache_}
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis

    volumes:
      - app_storage:/var/www/storage/app
      - ./logs/queue:/var/www/storage/logs

    networks:
      - sdc_internal

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

    healthcheck:
      test: ["CMD", "supervisorctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # DB - PostgreSQL 18 + PostGIS 3.6 (tuning via postgres/prod.conf)
  # ==========================================================================
  db:
    image: postgis/postgis:18-3.6-alpine
    restart: always
    hostname: db

    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

    environment:
      POSTGRES_DB: ${DB_DATABASE:-sdc}
      POSTGRES_USER: ${DB_USERNAME:-sdc}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/prod.conf:/etc/postgresql/postgresql.conf:ro
      - ./logs/postgres:/var/log/postgresql

    networks:
      - sdc_internal

    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 24G
        reservations:
          cpus: "1"
          memory: 4G

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sdc} -d ${DB_DATABASE:-sdc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # REDIS - Cache / Session / Queue
  # ==========================================================================
  redis:
    image: redis:7-alpine
    restart: always
    hostname: redis

    command: >
      redis-server
      --appendonly yes
      --maxmemory 3gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    networks:
      - sdc_internal

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 4G

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # EDGE - Caddy (TLS automatico + proxy reverso para o Octane)
  # Remova se houver um load balancer corporativo na frente.
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    restart: always
    hostname: caddy

    depends_on:
      - app

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - sdc_edge

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

# ============================================================================
# Networks
#   sdc_internal -> app/queue/db/redis (isolada, sem acesso externo)
#   sdc_edge     -> caddy <-> app (entrada HTTP/S)
# ============================================================================
networks:
  sdc_internal:
    driver: bridge
    internal: true
  sdc_edge:
    driver: bridge

# ============================================================================
# Volumes (RAID NVMe do R760 - aponte o data-root do Docker para o array)
# ============================================================================
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
