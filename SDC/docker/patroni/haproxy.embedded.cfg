global
    maxconn 1000

defaults
    mode tcp
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout check 3s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

listen postgresql_write
    bind :6434
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server db db:5432 check port 8008
    server db_replica_1 db_replica_1:5432 check port 8008
    server db_replica_2 db_replica_2:5432 check port 8008

# O limite de lag filtra saude; a aplicacao ainda verifica o marco WAL
# na mesma conexao de leitura antes de servir dados de cada operacao.
listen postgresql_read
    bind :6435
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica?lag=1048576
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server db db:5432 check port 8008
    server db_replica_1 db_replica_1:5432 check port 8008
    server db_replica_2 db_replica_2:5432 check port 8008

listen health
    bind :8404
    mode http
    monitor-uri /health
    monitor fail if { nbsrv(postgresql_write) lt 1 }
