name: newsdc

services:
  # Database
  db:
    image: mysql:8.0
    container_name: newsdc_db
    hostname: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sdc}
      MYSQL_USER: ${DB_USERNAME:-sdc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "13307:3306"
    volumes:
      - newsdc_db:/var/lib/mysql
    networks:
      - sdc_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Cache
  redis:
    image: redis:7-alpine
    container_name: newsdc_redis
    hostname: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "16380:6379"
    volumes:
      - newsdc_redis:/data
    networks:
      - sdc_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

  # Mail
  mailhog:
    image: mailhog/mailhog:latest
    container_name: newsdc_mailhog
    hostname: mailhog
    restart: unless-stopped
    ports:
      - "18026:1025"
      - "18025:8025"
    networks:
      - sdc_network

networks:
  sdc_network:
    driver: bridge

volumes:
  newsdc_db:
  newsdc_redis:
